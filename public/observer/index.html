<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#1a365d" />
    <link rel="manifest" href="manifest.json" />
    <title>Observer · My Collation Center</title>
    <link
      rel="stylesheet"
      href="/vendor/fa/css/all.min.css"
    />
    <link
      href="/shared/fonts.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/shared/style.css" />
  </head>
  <body>
    <div class="toast" id="toast"></div>
    <div id="app"></div>
    <script>window.NO_THEME = true; // the observer app is already dark</script>
    <script src="/shared/ui.js"></script>
    <script>
      let lk = null,
        OB,
        CC = null,
        TL = {},
        MSG = [],
        stream = null,
        streaming = false,
        rec = null,
        segs = [],
        rc = null,
        mic = false,
        fbMode = false,
        fbRec = null,
        stealth = false,
        CORR = null,
        lat = null,
        lng = null,
        gacc = null,
        taps = [],
        lastN = -1,
        busy = false,
        LIVEREQ = false,
        EC = [],
        BQ = 0;
      // device id: random, kept on this phone; the server locks the observer code to it on first login
      const DEV = (() => {
        let d = localStorage.getItem("dev");
        if (!d) {
          d = Array.from(crypto.getRandomValues(new Uint8Array(24)), (b) => b.toString(16).padStart(2, "0")).join("");
          localStorage.setItem("dev", d);
        }
        return d;
      })();
      // ---------- offline queue for photos / video clips (IndexedDB survives app restarts) ----------
      const idb = () =>
        new Promise((ok, no) => {
          const r = indexedDB.open("mcc", 1);
          r.onupgradeneeded = () => r.result.createObjectStore("q", { keyPath: "id", autoIncrement: true });
          r.onsuccess = () => ok(r.result);
          r.onerror = () => no(r.error);
        });
      const tx = async (mode, f) => {
        const d = await idb();
        return new Promise((ok, no) => {
          const t = d.transaction("q", mode),
            r = f(t.objectStore("q"));
          t.oncomplete = () => ok(r?.result);
          t.onerror = () => no(t.error);
        });
      };
      async function sendBlob(path, blob, type) {
        try {
          if (!navigator.onLine) throw new TypeError("offline");
          return await A.f(path, { method: "POST", body: blob, headers: { "Content-Type": type } });
        } catch (e) {
          if (!(e instanceof TypeError)) throw e;
          await tx("readwrite", (st) => st.add({ path, type, blob, code: OB.code }));
          BQ++;
          toast("📴 Offline — saved on the phone, will upload automatically.");
          render();
          return { queued: 1 };
        }
      }
      async function flushBlobs() {
        const all = (await tx("readonly", (st) => st.getAll()).catch(() => [])) || [];
        BQ = all.filter((x) => x.code == OB.code).length;
        for (const x of all) {
          if (x.code != OB.code || !navigator.onLine) continue;
          try {
            await A.f(x.path, { method: "POST", body: x.blob, headers: { "Content-Type": x.type } });
            await tx("readwrite", (st) => st.delete(x.id));
            BQ--;
          } catch (e) {
            if (e instanceof TypeError) break;
            await tx("readwrite", (st) => st.delete(x.id)); // rejected by the server: drop
          }
        }
      }
      const pv = document.createElement("video");
      pv.muted = true;
      pv.playsInline = true;
      pv.autoplay = true;
      pv.style.cssText = "width:100%;height:100%;object-fit:cover";
      const au = document.createElement("audio");
      au.autoplay = true;
      document.body.appendChild(au);
      const Q = () => JSON.parse(localStorage.getItem("q_" + OB.code) || "[]"),
        setQ = (q) => localStorage.setItem("q_" + OB.code, JSON.stringify(q));
      // offline-safe send: queues when the network is down, flushes when back
      async function send(path, body) {
        try {
          if (!navigator.onLine) throw new TypeError("offline");
          return await A.f(path, { method: "POST", body });
        } catch (e) {
          if (e instanceof TypeError) {
            const q = Q();
            q.push({ path, body });
            setQ(q);
            toast("📴 Offline — saved, will sync automatically.");
            render();
            return { queued: 1 };
          }
          throw e;
        }
      }
      async function flush() {
        if (!OB || !navigator.onLine || busy) return;
        const q = Q();
        if (!q.length) return;
        busy = true;
        setQ([]);
        const keep = [];
        for (const x of q) {
          try {
            await A.f(x.path, { method: "POST", body: x.body });
          } catch (e) {
            if (e instanceof TypeError) keep.push(x);
          }
        }
        setQ(keep);
        busy = false;
        toast("✅ Synced " + (q.length - keep.length) + " item(s).");
        load();
      }
      async function load() {
        try {
          const o = await A.get("obs");
          OB = { ...OB, ...o[0] };
          TL = OB.t || {};
          MSG = await A.get("messages");
          const incoming = MSG.filter((m) => m.from_id != OB.code);
          // new messages are shown on screen only — never read aloud (an observer may be standing in a crowd)
          if (lastN >= 0 && incoming.length > lastN && !incoming[0].cmd) toast("📩 New message: " + String(incoming[0].text).slice(0, 80));
          lastN = incoming.length;
          const c = incoming.find((m) => m.cmd == "save" && !m.ack.includes(OB.code));
          if (c) {
            A.post("messages/" + c.id + "/ack");
            saveClips("requested clip");
          }
        } catch {}
        if (!/INPUT|SELECT/.test(document.activeElement.tagName)) render();
      }
      // ---------- login ----------
      function loginV() {
        const LC = takeCreds("obs");
        $("#app").innerHTML =
          `<div class="observer-layout"><div class="phone-mockup"><div class="notch"></div><div class="phone-screen"><div class="app-header"><span>Observer</span></div><div class="app-content" style="justify-content:center"><div style="text-align:center;font-size:22px;font-weight:700">${esc(CFG?.appName || "My Collation Center")}</div><div style="text-align:center;color:#a0aec0;font-size:13px">Enter the code from your Situation Room</div><input id="lc" class="dk" style="flex:none;padding:14px" placeholder="OBS-0456-PU012-KN" autocapitalize="characters" value="${esc(LC?.u || localStorage.getItem("lastcode") || "")}"><input id="lpin" class="dk" style="flex:none;padding:14px" type="password" inputmode="numeric" maxlength="8" placeholder="PIN (4-8 digits)" onkeydown="event.key=='Enter'&&go()"><div style="color:#a0aec0;font-size:12px">First login on this phone: choose a PIN and remember it. The code then works only on this phone, with this PIN.</div><button class="btn btn-primary" style="padding:14px" onclick="go()">Login</button><button class="btn btn-outline" style="padding:12px;background:transparent;color:#a0aec0;border-color:#4a5568" onclick="scanLogin('obs',(c)=>{$('#lc').value=c.u;$('#lpin').focus();toast('Code filled in — now enter your PIN')})"><i class="fas fa-qrcode"></i> Scan QR code</button></div></div></div></div>`;
        if (LC) { $("#lpin").focus(); toast("Code filled in — now choose / enter your PIN"); }
      }
      async function go() {
        try {
          const code = $("#lc").value.trim().toUpperCase();
          const r = await A.post("login/observer", { code, pin: $("#lpin").value.trim(), device: DEV });
          localStorage.setItem("lastcode", code);
          sessionStorage.setItem("t", r.token);
          boot();
        } catch (e) {
          toast("❌ " + e.message);
        }
      }
      // ---------- camera / WebRTC / clips ----------
      // camera + microphone in ONE request, asked the moment the observer taps (not after the network set-up)
      async function getAv() {
        const video = { facingMode: { ideal: "environment" }, width: { ideal: 640 }, height: { ideal: 360 }, frameRate: { ideal: 15, max: 20 } };
        try {
          return await navigator.mediaDevices.getUserMedia({ video, audio: true });
        } catch (e) {
          if (e.name == "NotAllowedError" || e.name == "SecurityError") throw e;
          return await navigator.mediaDevices.getUserMedia({ video: true }); // no microphone / unusual camera
        }
      }
      async function startLK() {
        let media;
        try {
          media = getAv(); // the permission prompt appears now, while the video library and the server connection load
          media.catch(() => {});
          await loadScript("/vendor/livekit-client.umd.js");
          const { Room, RoomEvent, Track, VideoPresets } = LivekitClient,
            r = await A.post("livekit/token", {});
          lk = new Room({
            adaptiveStream: true,
            dynacast: true,
            publishDefaults: {
              simulcast: true,
              // 360p main layer + 180p fallback: watchable on 3G, ~0.5 Mbps at most (WhatsApp-call class)
              videoSimulcastLayers: [VideoPresets.h180],
              videoEncoding: { maxBitrate: 500000, maxFramerate: 15 },
            },
          });
          // talk-back: play whatever the Situation Room / Command Center / a shared viewer says
          lk.on(RoomEvent.TrackSubscribed, (t) => {
            if (t.kind != Track.Kind.Audio) return;
            const el = t.attach();
            el.autoplay = true;
            el.dataset.tb = "1";
            document.body.appendChild(el);
            el.play().catch(() => {});
            toast("🔊 The Situation Room is speaking to you");
          });
          lk.on(RoomEvent.TrackUnsubscribed, (t) => t.detach().forEach((el) => el.remove()));
          lk.on(RoomEvent.Disconnected, () => {
            if (streaming) toast("⚠️ Stream link lost — reconnecting…");
          });
          await lk.connect(r.url, r.token);
          lk.startAudio().catch(() => {});
          const ms = await media,
            vt = ms.getVideoTracks()[0],
            at = ms.getAudioTracks()[0];
          if (vt) await lk.localParticipant.publishTrack(vt, { source: Track.Source.Camera });
          if (at) await lk.localParticipant.publishTrack(at, { source: Track.Source.Microphone });
          stream = ms;
          pv.srcObject = stream;
          streaming = true;
          window.Capacitor?.Plugins?.KeepAwake?.keepAwake().catch(() => {});
          recSeg();
          hb();
          permStatus();
          toast("🔴 Streaming with adaptive quality — Situation Room can watch live.");
          render();
        } catch (e) {
          media?.then((m) => m.getTracks().forEach((t) => t.stop())).catch(() => {});
          lk?.disconnect();
          lk = null;
          toast(/NotAllowed|Permission/i.test(e.name + e.message) ? "📷 Camera / microphone blocked — allow them in the app settings, then try again." : "📷 " + (e.message || "Camera blocked. Needs HTTPS + permission."));
          permStatus();
        }
      }
      async function startStream() {
        if (CFG.lk) return startLK();
        try {
          stream = await navigator.mediaDevices.getUserMedia({
            video: {
              facingMode: "environment",
              width: { ideal: 640 },
              height: { ideal: 360 },
              frameRate: { ideal: 15, max: 20 },
            },
            audio: true,
          });
        } catch {
          try {
            stream = await navigator.mediaDevices.getUserMedia({ video: true });
          } catch {
            return toast("📷 Camera blocked. Needs HTTPS + permission.");
          }
        }
        pv.srcObject = stream;
        streaming = true;
        recSeg();
        hb();
        toast("🔴 Streaming — Situation Room can now watch live.");
        render();
      }
      function recSeg() {
        if (!stream || !window.MediaRecorder) return;
        const ch = [],
          r = new MediaRecorder(stream);
        rec = r;
        r.ondataavailable = (e) => e.data.size && ch.push(e.data);
        r.onstop = () => {
          segs.push(new Blob(ch, { type: "video/webm" }));
          if (segs.length > 2) segs.shift();
          if (streaming && rec === r) recSeg();
        };
        r.start();
        setTimeout(() => r.state == "recording" && r.stop(), 30000);
      }
      async function saveClips(kind) {
        if (rec && rec.state == "recording") {
          const r = rec;
          rec = null;
          r.stop();
          await new Promise((x) => setTimeout(x, 500));
          if (streaming) recSeg();
        }
        const s = segs.splice(0);
        for (const b of s) {
          try {
            await sendBlob("clip?kind=" + encodeURIComponent(kind), b, "video/webm");
          } catch (e) {
            toast("⚠️ Clip upload failed: " + e.message);
          }
        }
        if (s.length) toast("📼 Last 60s saved to room.");
      }
      async function stopStream() {
        streaming = false;
        window.Capacitor?.Plugins?.KeepAwake?.allowSleep().catch(() => {});
        lk?.disconnect();
        lk = null;
        Object.values(pcs).forEach((p) => p.close());
        pcs = {};
        if (rec && rec.state == "recording") {
          const r = rec;
          rec = null;
          r.stop();
        }
        await new Promise((x) => setTimeout(x, 500));
        await saveClips("buffer (last 60s)");
        stream?.getTracks().forEach((t) => t.stop());
        stream = null;
        pv.srcObject = null;
        hb();
        toast("⏹️ Stream stopped.");
        render();
      }
      let pcs = {};
      A.sig = async (m) => {
        if (m.type == "offer") {
          if (!stream) return A.send({ type: "nostream", to: m.from });
          const pc = new RTCPeerConnection({ iceServers: CFG.ice });
          pcs[m.from] = pc;
          stream.getTracks().forEach((t) => {
            const s = pc.addTrack(t, stream);
            if (t.kind == "video") {
              const p = s.getParameters();
              p.encodings = p.encodings?.length ? p.encodings : [{}];
              p.encodings[0].maxBitrate = 450000;
              s.setParameters(p).catch(() => {});
            }
          });
          pc.ontrack = (e) => {
            au.srcObject = e.streams[0];
          };
          pc.onicecandidate = (e) => e.candidate && A.send({ type: "ice", to: m.from, cand: e.candidate });
          await pc.setRemoteDescription(m.sdp);
          await pc.setLocalDescription(await pc.createAnswer());
          A.send({ type: "answer", to: m.from, sdp: pc.localDescription });
        }
        if (m.type == "ice") pcs[m.from]?.addIceCandidate(m.cand).catch(() => {});
      };
      // ---------- GPS + heartbeat ----------
      function hb() {
        if (navigator.onLine)
          A.post("observer/heartbeat", { lat, lng, acc: gacc, streaming, pend: OB ? Q().length + BQ : 0 })
            .then((r) => {
              if (r.live != LIVEREQ) {
                LIVEREQ = r.live;
                render();
              }
            })
            .catch(() => {});
      }
      // ---------- voice tally ----------
      async function setTally(p, v, src) {
        try {
          const r = await send("observer/tally", { party: p, v, src });
          if (r.anomaly)
            toast("⚠️ Total (" + r.total + ") exceeds registered voters (" + r.reg + ") — flagged to room.");
          else if (!r.queued) toast((src == "voice" ? "🎤 " : "✅ ") + p + " +" + v + (r.v != null && r.v != v ? " = " + r.v : ""));
          if (r.queued) {
            TL[p] = { v: (TL[p]?.v || 0) + v, edits: TL[p]?.edits || 0 }; // offline: add locally; the server adds it up when it syncs
          } else load();
          return true;
        } catch (e) {
          toast("⚠️ " + e.message);
          return false;
        }
      }
      // ---------- voice: stage figures, read back, confirm, then push ----------
      // Say a party code (the party is "brought forward") and then its figures. Figures for the same party
      // add up in a staging box; the app reads the total back ("Confirm APC total 100 votes"). Nothing reaches the
      // Situation Room until the observer confirms (say "confirm" or tap the button) - or types a corrected total first.
      const ALIAS = { A: ["ACCORD"], BP: ["BOOT PARTY", "BOOT"], YP: ["YOUTH PARTY"], LP: ["LABOUR", "LABOR"], ZLP: ["ZENITH"], AA: ["ACTION ALLIANCE"] };
      // how speech engines write out spoken letters ("pee dee pee" -> P D P)
      const LN = { ay: "a", bee: "b", see: "c", sea: "c", cee: "c", dee: "d", eff: "f", gee: "g", aitch: "h", jay: "j", kay: "k", el: "l", em: "m", en: "n", pee: "p", pea: "p", cue: "q", queue: "q", are: "r", ess: "s", tee: "t", tea: "t", vee: "v", ex: "x", why: "y", zed: "z", zee: "z" };
      let PEND = {},
        ORD = [],
        ACTIVE = null,
        ACT_T = 0,
        MUTE_UNTIL = 0,
        LASTTR = "",
        SPEAK = localStorage.getItem("readback") != "0",
        PMK = null,
        PML = [];
      try {
        const sv = JSON.parse(localStorage.getItem("pend") || "null");
        if (sv && sv.PEND) (PEND = sv.PEND), (ORD = sv.ORD || []);
      } catch {}
      const savePend = () => {
        try {
          localStorage.setItem("pend", JSON.stringify({ PEND, ORD }));
        } catch {}
      };
      const hasPend = () => Object.keys(PEND).length > 0;
      const pendTotal = (p) => PEND[p].parts.reduce((a, b) => a + b, 0);
      // lower-case words that mean each party, longest phrase first
      function PM() {
        const k = CFG.parties.join();
        if (PMK != k) {
          PMK = k;
          PML = CFG.parties
            .flatMap((p) => [...(p.length > 1 ? [p] : []), ...(ALIAS[p] || [])].map((a) => ({ p, w: a.toLowerCase().split(/\s+/) })))
            .sort((a, b) => b.w.length - a.w.length);
        }
        return PML;
      }
      // transcript -> words, with spoken numbers as digits and spelled-out letters joined ("a p c" / "ay pee see" -> "apc")
      function norm(s) {
        s = String(s).toLowerCase().replace(/(\d),(?=\d{3}\b)/g, "$1").replace(/[.,;:!?'"\-]/g, " ").replace(/([a-z])(\d)/g, "$1 $2").replace(/(\d)([a-z])/g, "$1 $2");
        const out = [];
        let run = [];
        const flush = () => {
          if (run.length > 1) out.push(run.join(""));
          else out.push(...run);
          run = [];
        };
        for (const w of w2n(s).split(/\s+/).filter(Boolean).map((x) => LN[x] || x)) {
          if (/^[a-z]$/.test(w)) run.push(w);
          else {
            flush();
            out.push(w);
          }
        }
        flush();
        return out;
      }
      // [{party, v}] in the order spoken; a figure belongs to the party named just before it (or still "brought forward")
      function voiceEntries(text) {
        const tk = norm(text),
          res = [];
        let cur = Date.now() - ACT_T < 25000 ? ACTIVE : null;
        for (let i = 0; i < tk.length; ) {
          const hit = PM().find((m) => m.w.every((x, j) => tk[i + j] === x));
          if (hit) {
            cur = hit.p;
            i += hit.w.length;
            continue;
          }
          if (/^\d+$/.test(tk[i]) && cur && +tk[i] <= 100000) res.push({ party: cur, v: +tk[i] });
          i++;
        }
        if (cur) (ACTIVE = cur), (ACT_T = Date.now());
        return res;
      }
      function say(t) {
        if (!SPEAK || !window.speechSynthesis) return;
        try {
          speechSynthesis.cancel();
          const u = new SpeechSynthesisUtterance(t);
          // the microphone must not hear our own read-back and take it for figures
          MUTE_UNTIL = Date.now() + 1500 + t.length * 90;
          u.onend = u.onerror = () => (MUTE_UNTIL = Date.now() + 1200);
          speechSynthesis.speak(u);
        } catch {}
      }
      function stage(p, v) {
        (PEND[p] = PEND[p] || { parts: [] }).parts.push(v);
        ORD.push(p);
      }
      function parseVoice(s) {
        if (Date.now() < MUTE_UNTIL) return;
        LASTTR = String(s);
        const w = norm(s).join(" ");
        if (hasPend()) {
          if (/^(please )?(confirm(ed)?|yes|yeah|correct|send( it)?|submit|ok(ay)?)( please)?$/.test(w)) return confirmPend();
          if (/^(cancel|clear( all)?|discard|start over|wrong)$/.test(w)) return clearPend();
          if (/^(undo|remove( last)?|delete( last)?)$/.test(w)) return undoPend();
        }
        const es = voiceEntries(s);
        if (!es.length) return render();
        es.forEach((e) => stage(e.party, e.v));
        savePend();
        render();
        const p = es[es.length - 1].party;
        say("Confirm " + p + " total " + pendTotal(p) + " votes");
      }
      function editPend(p, v) {
        const n = parseInt(v, 10);
        if (PEND[p] && !isNaN(n) && n >= 0 && n <= 100000) PEND[p].parts = [n]; // a typed total replaces what was spoken
        savePend();
        document.activeElement?.blur();
        render();
      }
      function undoPend() {
        const p = ORD.pop();
        if (p && PEND[p]) {
          PEND[p].parts.pop();
          if (!PEND[p].parts.length) delete PEND[p];
        }
        savePend();
        render();
        toast("↶ Last figure removed");
      }
      function clearPend() {
        PEND = {};
        ORD = [];
        ACTIVE = null;
        savePend();
        render();
        toast("Cleared — nothing was sent.");
      }
      async function confirmPend() {
        const items = Object.keys(PEND).map((p) => [p, pendTotal(p)]);
        if (!items.length) return;
        const keep = {};
        PEND = {};
        ORD = [];
        ACTIVE = null;
        render();
        for (const [p, v] of items) if (!(await setTally(p, v, "voice"))) keep[p] = { parts: [v] };
        PEND = keep; // anything that could not be sent stays here to try again
        ORD = Object.keys(keep);
        savePend();
        render();
        const sent = items.filter(([p]) => !keep[p]);
        if (sent.length) say("Sent. " + sent.map(([p, v]) => p + " " + v).join(", "));
      }
      const NW = {
        zero: 0,
        oh: 0,
        one: 1,
        two: 2,
        three: 3,
        four: 4,
        five: 5,
        six: 6,
        seven: 7,
        eight: 8,
        nine: 9,
        ten: 10,
        eleven: 11,
        twelve: 12,
        thirteen: 13,
        fourteen: 14,
        fifteen: 15,
        sixteen: 16,
        seventeen: 17,
        eighteen: 18,
        nineteen: 19,
        twenty: 20,
        thirty: 30,
        forty: 40,
        fifty: 50,
        sixty: 60,
        seventy: 70,
        eighty: 80,
        ninety: 90,
      };
      function w2n(s) {
        const out = [];
        let run = [];
        const flush = () => {
          if (!run.length) return;
          const r = run.filter((x) => x != "and");
          if (!r.length) {
            out.push("and");
            run = [];
            return;
          }
          let v;
          if (r.every((x) => NW[x] !== undefined && NW[x] < 10)) v = r.map((x) => NW[x]).join("");
          else {
            let tot = 0,
              cur = 0;
            for (const x of r) {
              if (NW[x] !== undefined) cur += NW[x];
              else if (x == "hundred") cur = (cur || 1) * 100;
              else if (x == "thousand") {
                tot += (cur || 1) * 1000;
                cur = 0;
              }
            }
            v = String(tot + cur);
          }
          out.push(v);
          run = [];
        };
        for (const w of String(s).toLowerCase().split(/\s+/)) {
          if (NW[w] !== undefined || w == "hundred" || w == "thousand" || (w == "and" && run.length))
            run.push(w);
          else {
            flush();
            out.push(w);
          }
        }
        flush();
        return out.join(" ");
      }
      let vm = null,
        vctx = null,
        vproc = null,
        vstr = null;
      // ---- voice typing: microphone permission FIRST, always-visible status, live words, speech engine loaded on demand ----
      let VSTAT = "", vtimer = null, LASTHEARD = 0;
      const vstat = (m) => {
        VSTAT = m;
        const e = $("#vstat");
        if (e) e.textContent = m;
      };
      async function primeMic() {
        vstat("🎤 Waiting for microphone permission…");
        try {
          (await navigator.mediaDevices.getUserMedia({ audio: true })).getTracks().forEach((t) => t.stop());
          return true;
        } catch (e) {
          vstat("🎤 Microphone blocked — allow it in the app / browser settings, then tap Mic again.");
          return false;
        }
      }
      async function voskStart() {
        if (!window.Vosk) {
          vstat("⬇ Loading the speech engine…");
          await loadScript("/vendor/vosk.js");
        }
        if (!vm) {
          const t0 = Date.now();
          clearInterval(vtimer);
          vtimer = setInterval(() => vstat("⬇ Downloading the offline speech model (first time only, about 40 MB)… " + Math.round((Date.now() - t0) / 1000) + " s"), 1000);
          vstat("⬇ Downloading the offline speech model (first time only, about 40 MB)…");
          try {
            vm = await Vosk.createModel(BASE + "/models/vosk-model-small-en-us-0.15.tar.gz");
          } finally {
            clearInterval(vtimer);
          }
        }
        vstr = await navigator.mediaDevices.getUserMedia({
          audio: { echoCancellation: true, noiseSuppression: true, channelCount: 1 },
        });
        vctx = new AudioContext();
        const rec = new vm.KaldiRecognizer(vctx.sampleRate);
        rec.on("result", (m) => {
          const t = m.result && m.result.text;
          if (t) {
            LASTHEARD = Date.now();
            parseVoice(t);
          }
        });
        rec.on("partialresult", (m) => {
          const t = m.result && m.result.partial;
          if (t) {
            LASTHEARD = Date.now();
            vstat("🎤 Hearing: " + t);
          }
        });
        const src = vctx.createMediaStreamSource(vstr);
        vproc = vctx.createScriptProcessor(4096, 1, 1);
        vproc.onaudioprocess = (e) => {
          try {
            rec.acceptWaveform(e.inputBuffer);
          } catch {}
        };
        src.connect(vproc);
        vproc.connect(vctx.destination);
        vstat("🎤 Listening (offline speech) — say e.g. “APC twenty”");
      }
      function voskStop() {
        clearInterval(vtimer);
        try {
          vproc?.disconnect();
          vstr?.getTracks().forEach((t) => t.stop());
          vctx?.close();
        } catch {}
        vproc = vstr = vctx = null;
      }
      function startFallback() {
        voskStart().catch((e) => {
          vstat("Offline speech unavailable (" + e.message + ") — trying the server.");
          fbLoop();
        });
      }
      async function toggleMic() {
        if (mic) {
          mic = false;
          voskStop();
          try {
            rc?.stop();
          } catch {}
          try {
            fbRec?.state == "recording" && fbRec.stop();
          } catch {}
          vstat("");
          return render();
        }
        mic = true;
        LASTHEARD = 0;
        render();
        if (!(await primeMic())) {
          mic = false;
          return render();
        }
        const SR = window.SpeechRecognition || window.webkitSpeechRecognition,
          offline = (why) => {
            fbMode = true;
            vstat(why);
            startFallback();
          };
        if (SR && !fbMode && navigator.onLine) {
          rc = new SR();
          rc.continuous = true;
          rc.interimResults = true; // show the words as they are heard
          rc.lang = "en-NG";
          rc.onstart = () => vstat("🎤 Listening — say e.g. “APC twenty”");
          rc.onresult = (e) => {
            let interim = "";
            LASTHEARD = Date.now();
            for (let i = e.resultIndex; i < e.results.length; i++)
              if (e.results[i].isFinal) parseVoice(e.results[i][0].transcript);
              else interim += e.results[i][0].transcript;
            if (interim) vstat("🎤 Hearing: " + interim);
          };
          rc.onend = () => {
            if (mic && !fbMode)
              try {
                rc.start();
              } catch {}
          };
          rc.onerror = (e) => {
            if (["network", "service-not-allowed", "language-not-supported"].includes(e.error)) offline("Switching to offline speech…");
            else if (e.error == "not-allowed") {
              mic = false;
              vstat("🎤 Microphone blocked — allow it in the app / browser settings, then tap Mic again.");
              render();
            } else if (e.error == "audio-capture") vstat("🎤 No microphone found on this device.");
          };
          try {
            rc.start();
          } catch {
            offline("Switching to offline speech…");
          }
        } else offline(SR ? "🎤 Offline — using the offline speech engine…" : "🎤 Starting the offline speech engine…");
        setTimeout(() => mic && !LASTHEARD && vstat("🎤 Nothing heard yet — hold the phone close and say “APC twenty”."), 12000);
        render();
      }
      async function fbLoop() {
        if (!mic) return;
        if (!CFG.stt) {
          mic = false;
          toast("Voice typing unavailable here and no offline STT service configured. Use manual entry.");
          return render();
        }
        try {
          const ms = await navigator.mediaDevices.getUserMedia({ audio: true });
          const r = new MediaRecorder(ms);
          fbRec = r;
          const ch = [];
          r.ondataavailable = (e) => ch.push(e.data);
          r.onstop = async () => {
            ms.getTracks().forEach((t) => t.stop());
            const b = new Blob(ch, { type: r.mimeType || "audio/webm" });
            try {
              const j = await A.f("stt", { method: "POST", body: b, headers: { "Content-Type": b.type } });
              if (j.text) parseVoice(j.text);
            } catch (e) {
              toast("⚠️ " + e.message);
            }
            fbLoop();
          };
          r.start();
          setTimeout(() => r.state == "recording" && r.stop(), 5000);
        } catch {
          mic = false;
          toast("Microphone unavailable.");
          render();
        }
      }
      function manualAdd() {
        const p = $("#mp").value,
          v = parseInt($("#mv").value, 10);
        if (isNaN(v) || v < 0) return toast("⚠️ Enter a valid number.");
        window.LASTP = p; // keep the same party selected, ready for the next figure
        setTally(p, v, "manual"); // adds to that party's running total
        $("#mv").value = "";
      }
      function openCorr(p) {
        CORR = p;
        render();
        $("#mi")?.focus();
      }
      async function saveCorr() {
        const v = parseInt($("#mi").value, 10);
        if (isNaN(v) || v < 0) return toast("⚠️ Enter a valid number.");
        try {
          await send("observer/tally/edit", { party: CORR, v });
          toast("✅ " + CORR + " set to " + v + ".");
          CORR = null;
          load();
        } catch (e) {
          toast("⚠️ " + e.message);
          CORR = null;
          load();
        }
      }
      // ---------- EC8A photo: resized to max 2400 px JPEG before upload (readable, ~0.5-1.5 MB) ----------
      async function ec8a(inp) {
        const f = inp.files[0];
        inp.value = "";
        if (!f) return;
        try {
          const img = await createImageBitmap(f),
            k = Math.min(1, 2400 / Math.max(img.width, img.height)),
            c = document.createElement("canvas");
          c.width = Math.round(img.width * k);
          c.height = Math.round(img.height * k);
          c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
          const b = await new Promise((r) => c.toBlob(r, "image/jpeg", 0.88));
          const r = await sendBlob("observer/ec8a", b, "image/jpeg");
          if (!r.queued) {
            toast("✅ EC8A photo uploaded.");
            EC = await A.get("observer/ec8a").catch(() => EC);
          }
          render();
        } catch (e) {
          toast("⚠️ " + e.message);
        }
      }
      async function saveSheet() {
        try {
          const r = await send("observer/sheet", { reg: $("#er").value, acc: $("#ea").value });
          if (!r.queued) toast("✅ EC8A voter figures saved.");
          load();
        } catch (e) {
          toast("⚠️ " + e.message);
        }
      }
      // ---------- incident ----------
      async function reportInc(silent) {
        const note = $("#note")?.value || "";
        saveClips("incident (60s buffer)");
        try {
          await send("observer/incident", { lat, lng, note, silent });
          if (!silent) toast("🚨 Incident sent with GPS + 60s video buffer.");
          else navigator.vibrate?.(200);
        } catch (e) {
          toast("⚠️ " + e.message);
        }
      }
      function clockTap() {
        const n = Date.now();
        taps = taps.filter((t) => n - t < 1200);
        taps.push(n);
        if (taps.length >= 3) {
          taps = [];
          reportInc(true);
        }
      }
      // ---------- UI ----------
      function render() {
        if (!OB) return;
        if (document.activeElement && /^pe_/.test(document.activeElement.id)) return; // a total is being typed
        const on = navigator.onLine,
          pend = Q().length,
          t = TL,
          ms = MSG.slice(0, 4);
        if (stealth) {
          $("#app").innerHTML =
            `<div class="observer-layout"><div class="phone-mockup"><div class="notch"></div><div class="phone-screen"><div class="clock" onclick="clockTap()" onpointerdown="window.HOLD=Date.now()" onpointerup="if(Date.now()-(window.HOLD||Date.now())>1500){stealth=false;render()}"><div id="clk" style="font-size:64px;font-weight:300">${new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" })}</div><div style="color:#718096">Clock · Alarm</div></div><div style="position:absolute;bottom:26px;right:30px;opacity:.15;color:#fff;font-size:11px;cursor:pointer" onclick="stealth=false;render()">open</div></div></div></div>`;
          return;
        }
        const rows =
          CFG.parties
            .filter((p) => t[p])
            .map(
              (p) =>
                `<div class="tally-row" onclick="openCorr('${p}')"><span>${p}</span><span>${t[p].v}${t[p].edits ? ' <i class="fas fa-pen" style="font-size:10px;opacity:.6" title="corrected"></i>' : ""}</span></div>`,
            )
            .join("") ||
          '<div style="color:#a0aec0;font-size:13px">No tallies yet. Tap Mic and say e.g. “APC 251”, or type below. Each entry adds to that party’s total.</div>';
        $("#app").innerHTML =
          `<div class="observer-layout"><div class="phone-mockup"><div class="notch"></div><div class="phone-screen"><div class="app-header" style="flex-direction:column;align-items:stretch;gap:3px">
<div style="display:flex;justify-content:space-between;align-items:center"><span style="font-weight:700;font-size:14px;color:#fff">${esc(CFG.appName || CC || "Command Center")}</span><span style="color:${on ? "#68d391" : "#fc8181"};font-size:11px"><i class="fas fa-circle" style="font-size:8px"></i> ${!on ? "Offline" + (pend + BQ ? " · " + (pend + BQ) + " queued" : "") : pend + BQ ? "Syncing " + (pend + BQ) : "Online"}</span></div>
<div style="display:flex;justify-content:space-between;align-items:center;color:#a0aec0;font-size:11px"><span><i class="fas fa-building-columns" style="font-size:10px"></i> ${esc(OB.room_name || OB.room_id)}</span><span class="mono">${esc(OB.code)} · PU ${esc(OB.pu)}</span></div></div>
<div class="app-content">${LIVEREQ && !streaming ? `<button class="btn-report" style="background:#e53e3e" onclick="startStream()"><i class="fas fa-video"></i> Situation Room requests LIVE VIDEO — tap to start</button>` : ""}<div style="font-size:12px;color:#a0aec0"><i class="fas fa-location-dot"></i> ${esc(OB.lga)} LGA · ${esc(OB.ward)} Ward</div>
<div class="camera-view" id="camSlot"><div class="camera-overlay"><span style="color:${streaming ? "#fc8181" : "#fff"}">${streaming ? "● LIVE Streaming" : "Ready"}</span><span>${lat != null ? lat.toFixed(4) + ", " + lng.toFixed(4) : "GPS…"}</span></div><div class="stream-controls">${streaming ? '<button style="background:#e53e3e;color:#fff" onclick="stopStream()">⏹ Stop Stream</button>' : '<button style="background:#38a169;color:#fff" onclick="startStream()">▶ Start Stream</button>'}</div></div>
<div class="tally-panel"><div class="tally-title"><span>TALLY · entries add up · tap a row to correct</span><span style="display:flex;gap:6px"><button class="btn btn-sm btn-outline" style="background:transparent;color:#a0aec0;border-color:#4a5568" title="Read figures back aloud" onclick="SPEAK=!SPEAK;localStorage.setItem('readback',SPEAK?1:0);if(!SPEAK)speechSynthesis?.cancel();render()"><i class="fas fa-volume-${SPEAK ? "high" : "xmark"}"></i></button><button class="btn btn-sm ${mic ? "btn-danger" : "btn-primary"}" onclick="toggleMic()"><i class="fas fa-microphone"></i> ${mic ? (fbMode ? "Listening (server)" : "Listening") : "Mic"}</button></span></div>${hasPend() ? `<div style="background:#2a4365;border:1px solid #4299e1;border-radius:12px;padding:10px;margin:8px 0"><div style="font-weight:700;font-size:13px;margin-bottom:6px">⏳ Confirm before it is sent to the Situation Room</div>${Object.keys(PEND).map((q) => `<div style="display:flex;align-items:center;gap:8px;margin:6px 0"><b style="width:46px">${q}</b><span style="flex:1;font-size:12px;color:#bee3f8">${PEND[q].parts.join(" + ")}${PEND[q].parts.length > 1 ? " =" : ""}</span><input id="pe_${q}" class="dk" type="number" inputmode="numeric" value="${pendTotal(q)}" style="width:86px;flex:none;padding:8px" onchange="editPend('${q}',this.value)"></div>`).join("")}<div class="correction-controls" style="margin-top:8px"><button style="background:#38a169;flex:3" onclick="confirmPend()">✓ Confirm &amp; send</button><button style="background:#718096" onclick="undoPend()">↶</button><button style="background:#e53e3e" onclick="clearPend()">✕</button></div><div style="color:#a0aec0;font-size:11px;margin-top:6px">Say “confirm” to send, “undo” to drop the last figure, “cancel” to clear — or type a corrected total above, then confirm.</div></div>` : ""}${rows}<div id="vstat" style="margin-top:8px;color:#faf089;font-size:12px;min-height:16px">${esc(VSTAT)}</div><div id="tr" style="margin-top:8px;color:#a0aec0;font-size:12px">${mic && ACTIVE && Date.now() - ACT_T < 25000 ? '🎤 Listening for <b style="color:#fff">' + ACTIVE + "</b> figures… " : ""}${LASTTR ? "“" + esc(LASTTR) + "”" : ""}</div>
${CORR ? `<div class="correction-controls"><input id="mi" type="number" inputmode="numeric" value="${t[CORR].v}"><button style="background:#38a169" onclick="saveCorr()">✓</button><button style="background:#e53e3e" onclick="CORR=null;render()">✕</button></div>` : ""}
<div class="correction-controls"><select class="dk" id="mp" onchange="LASTP=this.value">${CFG.parties
            .map((p) => `<option value="${p}" ${window.LASTP == p ? "selected" : ""}>${p}${t[p] ? " (" + t[p].v + ")" : ""}</option>`)
            .join(
              "",
            )}</select><input id="mv" class="dk" type="number" inputmode="numeric" placeholder="votes"><button style="background:#2b6cb0" onclick="manualAdd()">+</button></div></div>
<div class="tally-panel"><div class="tally-title"><span>EC8A RESULT SHEET</span><span>${EC.length ? '<span style="color:#68d391">' + EC.length + " uploaded ✓</span>" : '<span style="color:#fc8181">not uploaded</span>'}</span></div><div class="correction-controls" style="margin:0 0 8px"><input id="er" class="dk" type="number" inputmode="numeric" placeholder="Voters on register" value="${OB.ec_reg ?? ""}"><input id="ea" class="dk" type="number" inputmode="numeric" placeholder="Accredited (BVAS)" value="${OB.ec_acc ?? ""}"><button style="background:#2b6cb0" onclick="saveSheet()" title="Save EC8A voter figures">✓</button></div><label class="btn btn-primary" style="width:100%;padding:12px;cursor:pointer"><i class="fas fa-camera"></i> Photograph EC8A<input type="file" accept="image/*" capture="environment" style="display:none" onchange="ec8a(this)"></label><div style="color:#a0aec0;font-size:11px;margin-top:6px">Whole sheet, flat, in good light. Your room uses it to settle any difference between the two observers.</div></div>
<div class="tally-panel"><div class="tally-title">MESSAGES FROM ROOM / COMMAND</div>${
            ms
              .filter((m) => !m.cmd)
              .map(
                (m) =>
                  `<div style="font-size:13px;padding:6px 0;border-bottom:1px solid #4a5568"><b>${esc(m.from_id)}</b>: ${esc(m.text)} ${m.from_id != OB.code && !m.ack.includes(OB.code) ? `<button class="btn btn-sm btn-success" onclick="A.post('messages/${m.id}/ack')">OK</button>` : ""}</div>`,
              )
              .join("") || '<div style="color:#a0aec0;font-size:13px">None</div>'
          }<div class="correction-controls"><input id="om" class="dk" placeholder="Message room"><button style="background:#2b6cb0" onclick="msgTo('x',$('#om').value)"><i class="fas fa-paper-plane"></i></button></div></div></div>
<div class="app-footer"><input id="note" class="dk" style="flex:none;padding:10px" placeholder="Incident note (optional)"><button class="btn-report" onclick="reportInc(false)"><i class="fas fa-triangle-exclamation"></i> REPORT INCIDENT</button><div style="display:flex;gap:8px"><button class="btn btn-outline" style="flex:1" onclick="stealth=true;render()"><i class="fas fa-clock"></i> Stealth</button><button class="btn btn-outline" style="flex:1" onclick="logout()"><i class="fas fa-right-from-bracket"></i> Logout</button></div></div></div></div>
<div class="instructions-panel"><div class="instruction-card"><h4>🎤 Voice typing</h4><p>Say a party, then its figures: “APC 20”, “PDP 20”, “APC 30”. Figures for the same party add up and the app reads the total back (“Confirm APC total 50 votes”). Say <b>confirm</b> to send, or type a corrected total and tap Confirm. Parties: ${CFG.parties.join(", ")}.</p></div><div class="instruction-card"><h4>🔒 One correction only</h4><p>Tap a row to correct once. It then locks (enforced by the server).</p></div><div class="instruction-card"><h4>🕵️ Stealth SOS</h4><p>Stealth shows a clock. Triple-tap it to silently send an incident.</p></div></div></div>`;
        const s = $("#camSlot");
        if (s) s.prepend(pv);
      }
      async function boot() {
        if (!window.Capacitor) navigator.serviceWorker?.register("sw.js").catch(() => {});
        setTimeout(() => {
          const c = navigator.connection;
          if (
            navigator.onLine &&
            !c?.saveData &&
            (c?.type == "wifi" || (!c?.type && c?.effectiveType == "4g"))
          )
            fetch(BASE + "/models/vosk-model-small-en-us-0.15.tar.gz").catch(() => {});
        }, 8000);
        try {
          const me = await A.get("me");
          OB = me.obs;
          CC = me.cc;
          CFG = await A.get("config");
        } catch {
          sessionStorage.removeItem("t");
          return loginV();
        }
        A.role = "obs";
        A.ws((m) => {
          if (m.type == "changed") return load();
          if (m.type == "live") {
            LIVEREQ = m.on;
            if (m.on && !streaming) {
              toast("📡 Situation Room requested live video.");
              navigator.vibrate?.([200, 100, 200]);
              startStream();
            } else if (!m.on && streaming) stopStream();
            return render();
          }
          if (m.type == "reset") {
            toast("This code was moved to another phone.");
            return setTimeout(logout, 1500);
          }
          A.sig(m);
        });
        EC = await A.get("observer/ec8a").catch(() => []);
        // Android app: GPS keeps flowing with the screen off (foreground service with a notification)
        const BG = window.Capacitor?.Plugins?.BackgroundGeolocation;
        if (BG)
          BG.addWatcher(
            { backgroundTitle: "Observer GPS active", backgroundMessage: "Sharing your location with your Situation Room", requestPermissions: true, stale: false, distanceFilter: 10 },
            (p, err) => {
              if (err) return toast("📍 " + (err.code == "NOT_AUTHORIZED" ? "Allow location 'all the time' in Settings." : err.message));
              lat = p.latitude;
              lng = p.longitude;
              gacc = p.accuracy;
              if (Date.now() - (window._bgHb || 0) > 14000) (window._bgHb = Date.now()), hb();
            },
          );
        else if (navigator.geolocation)
          navigator.geolocation.watchPosition(
            (p) => {
              lat = p.coords.latitude;
              lng = p.coords.longitude;
              gacc = p.coords.accuracy;
            },
            () => toast("📍 Location permission needed for GPS tracking."),
            { enableHighAccuracy: true, maximumAge: 5000 },
          );
        // heartbeat + GPS: every 15 s, every 5 s while streaming; queued items retried every 5 s
        let lastHb = 0;
        setInterval(() => {
          if (streaming || Date.now() - lastHb > 14000) {
            lastHb = Date.now();
            hb();
          }
          flush();
          flushBlobs().catch(() => {});
        }, 5000);
        setInterval(() => {
          const c = $("#clk");
          if (c) c.textContent = new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
        }, 1000);
        addEventListener("online", () => {
          flush();
          render();
        });
        addEventListener("offline", render);
        await load();
        flush();
      }
      // observer messages always go to its own room (server enforces)
      window.msgTo = (_, text) =>
        text
          ? A.post("messages", { to: "room:" + OB.room_id, text })
              .then(() => {
                toast("📨 Sent to room.");
                $("#om") && ($("#om").value = "");
              })
              .catch((e) => toast("⚠️ " + e.message))
          : toast("Type a message first.");
      A.get("config")
        .then((c) => {
          CFG = c;
          document.title = c.appName + " · Observer";
        })
        .catch(() => {})
        .finally(() => (A.tok ? boot() : loginV()));
    </script>
