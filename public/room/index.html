<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Situation Room · My Collation Center</title>
    <link
      rel="stylesheet"
      href="/vendor/fa/css/all.min.css"
    />
    <link
      href="/shared/fonts.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/vendor/leaflet/leaflet.css" />
    <link rel="stylesheet" href="/shared/style.css" />
  </head>
  <body>
    <div class="toast" id="toast"></div>
    <div id="app"></div>
    <script src="/vendor/leaflet/leaflet.js"></script>
    <script src="/vendor/qrcode.js"></script>
    <script src="/shared/ui.js"></script>
    <script>
      const rObs = () => {
        const all = DATA.obs;
        setTimeout(() => {
          locLoad("lga");
          if ($("#gl")?.value) locLoad("ward");
        }, 60);
        return `<div class="dashboard-grid side"><div class="card"><div class="card-header"><h3><i class="fas fa-key"></i> Generate observer codes</h3></div>${CFG.loc ? blkPicker() : ""}<details ${CFG.loc ? "" : "open"} style="margin-top:12px"><summary style="cursor:pointer;font-weight:600;color:#2b6cb0">${CFG.loc ? "Add one observer by typing the details" : "Add an observer (type the details)"}</summary><div style="margin-top:10px">${ME.room.state ? `<input type="hidden" id="gs" value="${esc(ME.room.state)}"><div class="fi" style="background:#f7fafc;color:#4a5568"><i class="fas fa-lock" style="font-size:11px"></i> State: <b>${esc(ME.room.state)}</b> <span class="muted">(fixed for this room)</span></div>` : `<select class="fi" id="gs" onchange="locLoad('lga')">${CFG.states.map((s) => `<option ${s == ME.room.state ? "selected" : ""}>${s}</option>`).join("")}</select>`}<input class="fi" id="gl" list="dl-lga" placeholder="${ME.room.scope && ME.room.scope.includes(",") ? "LGA (one of: " + esc(ME.room.scope.split(",").join(", ")) + ")" : "LGA"}" value="${esc(ME.room.scope && !ME.room.scope.includes(",") ? ME.room.scope : "")}" ${ME.room.scope && !ME.room.scope.includes(",") ? "readonly" : ""} onchange="locLoad('ward')"><datalist id="dl-lga"></datalist><input class="fi" id="gw" list="dl-ward" placeholder="Ward" onchange="locLoad('pu')"><datalist id="dl-ward"></datalist><input class="fi" id="gp" list="dl-pu" placeholder="PU code (e.g. 012)" onchange="puReg()"><datalist id="dl-pu"></datalist><input class="fi" id="gr" type="number" placeholder="Registered voters (default 500)"><input class="fi" id="gn" placeholder="Observer name (optional)"><button class="btn btn-primary" onclick="genCode()"><i class="fas fa-key"></i> Generate Code</button><div class="muted" style="margin-top:8px">The code is the ONLY login link. It binds one observer to this room and one PU. Generate two codes per PU: the two observers' figures are compared automatically. On first login the code locks to that phone with a PIN the observer chooses; use "Reset phone" if a phone is lost.</div></div></details></div>
<div class="card"><div class="card-header"><h3><i class="fas fa-users"></i> Observers (${all.length})</h3><button class="btn btn-sm btn-outline" onclick="officerSheet()"><i class="fas fa-clipboard-check"></i> Officer sign-ins</button><button class="btn btn-sm btn-outline" onclick="printCreds('Observer sign-in sheets',flt(DATA.obs).filter(o=>o.active&&!o.bound).slice(0,400).map(o=>obsCredOf(o.code)))"><i class="fas fa-print"></i> Print QR sheet (unused codes)</button><input placeholder="Search code, name, PU…" value="${esc(F.q || "")}" onchange="setF('q',this.value)" style="padding:6px 10px;border-radius:8px;border:1px solid #cbd5e0"></div><div class="tw"><table><tr><th>Code</th><th>Name</th><th>Location</th><th>Reg.</th><th>Status</th><th>Phone</th><th>Tallies (hover = edit history)</th><th>Actions</th></tr>${flt(all).slice(0, 500).map((o) => `<tr><td class="mono">${esc(o.code)}</td><td><input class="fi" id="on_${o.code}" style="margin:0;min-width:130px;padding:6px 8px" value="${esc(o.name)}" placeholder="Add name" onchange="setObsName('${o.code}',this.value)"></td><td>${esc(o.state)}/${esc(o.lga)}/${esc(o.ward)}/PU ${esc(o.pu)}</td><td>${o.reg}</td><td>${o.active ? pill(st(o)) : '<span class="pill r">Revoked</span>'}</td><td>${o.bound ? '<span class="pill g">Locked</span>' : '<span class="pill s">Not used yet</span>'}</td><td>${tallyCell(o)}</td><td><button class="btn btn-sm btn-outline" onclick="SEL='${o.code}';TAB='dash';render()">Feed</button> <button class="btn btn-sm btn-outline" onclick="navigator.clipboard?.writeText('${o.code}');toast('Copied')">Copy</button> <button class="btn btn-sm btn-outline" onclick="obsCred('${o.code}')"><i class="fas fa-qrcode"></i> QR</button> <button class="btn btn-sm btn-outline" onclick="wardOfficer('${esc(o.lga)}','${esc(o.ward)}')"><i class="fas fa-clipboard-check"></i> Officer</button> ${o.bound ? `<button class="btn btn-sm btn-outline" onclick="resetDev('${o.code}')">Reset phone</button> ` : ""}<button class="btn btn-sm ${o.active ? "btn-danger" : "btn-success"}" onclick="A.post('obs/${o.code}/toggle')">${o.active ? "Revoke" : "Activate"}</button></td></tr>`).join("")}</table></div></div></div>`;
      };
      let PUS = [];
      async function locLoad(next) {
        if (!CFG.loc) return;
        const s = $("#gs").value,
          l = $("#gl")?.value,
          w = $("#gw")?.value;
        try {
          if (next == "lga") {
            const mine = String(ME.room.scope || "").split(",").map((x) => x.trim().toLowerCase()).filter(Boolean);
            $("#dl-lga").innerHTML = (await A.get("locations?state=" + encodeURIComponent(s)))
              .filter((x) => !mine.length || mine.includes(x.lga.toLowerCase()))
              .map((x) => `<option>${esc(x.lga)}`)
              .join("");
          }
          if (next == "ward")
            $("#dl-ward").innerHTML = (
              await A.get("locations?state=" + encodeURIComponent(s) + "&lga=" + encodeURIComponent(l))
            )
              .map((x) => `<option>${esc(x.ward)}`)
              .join("");
          if (next == "pu") {
            PUS = await A.get(
              "locations?state=" +
                encodeURIComponent(s) +
                "&lga=" +
                encodeURIComponent(l) +
                "&ward=" +
                encodeURIComponent(w),
            );
            $("#dl-pu").innerHTML = PUS.map(
              (x) => `<option value="${esc(x.pu)}" label="${esc(x.name || "")}">`,
            ).join("");
          }
        } catch {}
      }
      const puReg = () => {
        const p = PUS.find((x) => x.pu == $("#gp").value);
        if (p) $("#gr").value = p.reg;
      };
      // an observer's sign-in card: the code + a QR that opens the Observer sign-in with the code filled in
      // ---------- bulk observer codes: pick LGAs, wards and polling units with tick-boxes ----------
      const BLK = { lgas: new Set(), all: [], loaded: false, rows: [], key: "", wards: new Set(), pus: new Set(), per: 2, busy: false, off: {} };
      const wk = (r) => r.lga + "|" + r.ward,
        pk = (r) => r.lga + "|" + r.ward + "|" + r.pu,
        pn = (v) => String(v || "").split(/[\/-]/).pop().replace(/\D/g, "").padStart(3, "0");
      async function blkInit() {
        if (BLK.loaded || !CFG.loc) return;
        BLK.loaded = true;
        const mine = String(ME.room.scope || "").split(",").map((x) => x.trim().toLowerCase()).filter(Boolean);
        BLK.all = (await A.get("locations?state=" + encodeURIComponent(ME.room.state)).catch(() => [])).map((x) => x.lga).filter((l) => !mine.length || mine.includes(l.toLowerCase()));
        if (BLK.all.length == 1) BLK.lgas.add(BLK.all[0]);
        await blkUnits();
        render();
      }
      async function blkUnits() {
        const key = [...BLK.lgas].sort().join(",");
        if (key === BLK.key) return;
        BLK.key = key;
        BLK.rows = key ? await A.get("locations/units?state=" + encodeURIComponent(ME.room.state) + "&lgas=" + encodeURIComponent(key)).catch(() => []) : [];
        BLK.wards = new Set(BLK.rows.map(wk)); // everything ticked to begin with: untick what you do not want
        BLK.pus = new Set(BLK.rows.map(pk));
      }
      const blkRender = () => blkUnits().then(render);
      const blkLga = (l, on) => (on ? BLK.lgas.add(l) : BLK.lgas.delete(l), blkRender());
      const blkLgaAll = (on) => ((BLK.lgas = on ? new Set(BLK.all) : new Set()), blkRender());
      function blkWard(k, on) {
        on ? BLK.wards.add(k) : BLK.wards.delete(k);
        BLK.rows.filter((r) => wk(r) == k).forEach((r) => (on ? BLK.pus.add(pk(r)) : BLK.pus.delete(pk(r))));
        render();
      }
      function blkWardAll(on) {
        BLK.wards = on ? new Set(BLK.rows.map(wk)) : new Set();
        BLK.pus = on ? new Set(BLK.rows.map(pk)) : new Set();
        render();
      }
      const blkPu = (k, on) => (on ? BLK.pus.add(k) : BLK.pus.delete(k), render());
      function blkPuAll(on) {
        BLK.rows.filter((r) => BLK.wards.has(wk(r))).forEach((r) => (on ? BLK.pus.add(pk(r)) : BLK.pus.delete(pk(r))));
        render();
      }
      const blkChosen = () => BLK.rows.filter((r) => BLK.pus.has(pk(r)) && BLK.wards.has(wk(r)));
      function blkPlan() {
        const have = {};
        DATA.obs.filter((o) => o.active).forEach((o) => (have[[o.lga, o.ward, o.pu].join("|")] = (have[[o.lga, o.ward, o.pu].join("|")] || 0) + 1));
        let codes = 0,
          topped = 0;
        const u = blkChosen();
        u.forEach((r) => {
          const need = Math.max(0, BLK.per - (have[[r.lga, r.ward, pn(r.pu)].join("|")] || 0));
          codes += need;
          if (need < BLK.per) topped++;
        });
        return { units: u.length, codes, topped };
      }
      const blkLinks = (f, all) => ` <a href="#" onclick="${f}(true);return false">all</a> · <a href="#" onclick="${f}(false);return false">none</a>`;
      // Ward Collation Officers (1), named while the observers are generated
      const blkOffs = () =>
        [...new Set(blkChosen().map(wk))]
          .map((k) => ({ k, lga: k.split("|")[0], ward: k.split("|")[1], ...(BLK.off[k] || {}) }))
          .filter((o) => (o.name || "").trim());
      // wards that already have an active Ward Collation Officer
      const wardHas = (k) => (OFFS || []).find((o) => o.level == "ward" && o.active && (o.lga || "").toLowerCase() == k.split("|")[0].toLowerCase() && (o.ward || "").toLowerCase() == k.split("|")[1].toLowerCase());
      const blkMissing = () => [...new Set(blkChosen().map(wk))].filter((k) => !wardHas(k) && !(BLK.off[k]?.name || "").trim());
      function blkOffForm() {
        if (!OFFS) offLoad();
        const ws = [...new Set(blkChosen().map(wk))];
        if (!ws.length || ws.length > 40) return ws.length ? '<div class="muted" style="margin:8px 0">Choose at most 40 wards per batch so every ward officer can be named here.</div>' : "";
        return `<details open style="margin:8px 0"><summary style="cursor:pointer;font-weight:600"><i class="fas fa-clipboard-check"></i> Ward Collation Officer 1 — required for every ward ${blkMissing().length ? `<span style="color:#c53030">(${blkMissing().length} still to name)</span>` : '<span style="color:#2f855a">✓ all wards covered</span>'}</summary><div class="muted" style="margin:6px 0">Observers cannot be created for a ward until its supervisor is named. They get a sign-in QR.</div>${ws.map((k) => { const [l, w] = k.split("|"), o = BLK.off[k] || {}, h = wardHas(k); if (h) return `<div style="margin:4px 0;font-size:13px">✓ <b>${esc(w)}</b> — ${esc(h.name)} <span class="muted">${esc(h.phone || "")}</span></div>`; return `<div style="display:flex;gap:6px;align-items:center;margin:4px 0;flex-wrap:wrap"><span style="min-width:110px;font-size:13px"><b>${esc(w)}</b>${BLK.all.length > 1 ? ` <span class="muted">${esc(l)}</span>` : ""}</span><input class="fi" style="flex:1;min-width:120px;margin:0" placeholder="Officer name" value="${esc(o.name || "")}" oninput="blkOff('${esc(k)}','name',this.value)"><input class="fi" style="flex:1;min-width:110px;margin:0" type="tel" placeholder="Phone" value="${esc(o.phone || "")}" oninput="blkOff('${esc(k)}','phone',this.value)"></div>`; }).join("")}</details>`;
      }
      const blkOff = (k, f, v) => ((BLK.off[k] = BLK.off[k] || {})[f] = v);
      function blkPicker() {
        setTimeout(blkInit, 0);
        if (!BLK.loaded) return '<div class="muted">Loading the LGAs…</div>';
        const wards = [...new Set(BLK.rows.map(wk))],
          pus = BLK.rows.filter((r) => BLK.wards.has(wk(r))),
          plan = blkPlan(),
          multi = BLK.all.length > 1,
          box = (h) => `<div class="lgabox" style="max-height:170px">${h}</div>`;
        return `<div class="muted" style="margin-bottom:8px">Tick the LGAs, wards and polling units this batch is for — everything under a ticked LGA starts ticked, so you only untick what you don't want. Names are optional and can be typed in the list afterwards.</div>
          ${multi ? `<div class="muted" style="margin:4px 0">LGAs <b>${BLK.lgas.size}</b> of ${BLK.all.length} ${blkLinks("blkLgaAll")}</div>${box(BLK.all.map((l) => `<label><input type="checkbox" ${BLK.lgas.has(l) ? "checked" : ""} onchange="blkLga(this.dataset.v,this.checked)" data-v="${esc(l)}"> ${esc(l)}</label>`).join(""))}` : `<div class="fi" style="background:#f7fafc;color:#4a5568">LGA: <b>${esc(BLK.all[0] || "—")}</b></div>`}
          ${wards.length ? `<div class="muted" style="margin:4px 0">Wards <b>${BLK.wards.size}</b> of ${wards.length} ${blkLinks("blkWardAll")}</div>${box(wards.map((k) => { const [l, w] = k.split("|"); return `<label><input type="checkbox" ${BLK.wards.has(k) ? "checked" : ""} onchange="blkWard(this.dataset.v,this.checked)" data-v="${esc(k)}"> ${esc(w)}${multi ? ` <span class="muted">· ${esc(l)}</span>` : ""}</label>`; }).join(""))}
          <div class="muted" style="margin:4px 0">Polling units <b>${plan.units}</b> of ${pus.length} ${blkLinks("blkPuAll")}</div>${box(pus.map((r) => `<label><input type="checkbox" ${BLK.pus.has(pk(r)) ? "checked" : ""} onchange="blkPu(this.dataset.v,this.checked)" data-v="${esc(pk(r))}"> ${esc(r.pu)}${r.name ? ` <span class="muted">· ${esc(r.name)}</span>` : ""}${BLK.wards.size > 1 ? ` <span class="muted">· ${esc(r.ward)}</span>` : ""}</label>`).join(""))}` : BLK.lgas.size ? '<div class="muted">No polling units are loaded for that LGA yet.</div>' : '<div class="muted">Tick at least one LGA.</div>'}
          <div style="display:flex;gap:10px;align-items:center;margin:10px 0 6px;flex-wrap:wrap"><span>Observers per polling unit</span><select class="fi" style="width:auto;margin:0;flex:none" onchange="BLK.per=+this.value;render()">${[1, 2, 3, 4, 5].map((n) => `<option value="${n}" ${BLK.per == n ? "selected" : ""}>${n}${n == 2 ? " (recommended)" : ""}</option>`).join("")}</select></div>
          <div class="muted" style="margin-bottom:8px"><b>${plan.units}</b> polling unit${plan.units == 1 ? "" : "s"} → <b>${plan.codes}</b> new code${plan.codes == 1 ? "" : "s"}${plan.topped ? ` · ${plan.topped} unit${plan.topped == 1 ? " already has" : "s already have"} observers and only get what is missing` : ""}</div>
          ${blkOffForm()}
          <button class="btn btn-primary" ${(plan.codes || blkOffs().length) && !blkMissing().length && !BLK.busy ? "" : "disabled"} onclick="blkGo()"><i class="fas fa-key"></i> Generate ${plan.codes} code${plan.codes == 1 ? "" : "s"}</button>`;
      }
      async function blkGo() {
        BLK.busy = true;
        render();
        try {
          const r = await A.post("room/obs/bulk", { per: BLK.per, units: blkChosen().map(({ lga, ward, pu }) => ({ lga, ward, pu })), officers: blkOffs().map((o) => ({ lga: o.lga, ward: o.ward, name: o.name, phone: o.phone })) });
          BLK.busy = false;
          BLK.off = {};
          await loadAll();
          blkDone(r);
        } catch (e) {
          BLK.busy = false;
          render();
          toast("⚠️ " + e.message);
        }
      }
      function blkDone(r) {
        document.getElementById("credm")?.remove();
        const w = document.createElement("div");
        w.id = "credm";
        w.style.cssText = "position:fixed;inset:0;background:rgba(15,23,42,.6);z-index:9000;display:flex;align-items:center;justify-content:center;padding:14px;overflow:auto";
        w.innerHTML = `<div class="card" style="max-width:460px;width:100%;margin:auto"><div class="card-header"><h3><i class="fas fa-circle-check" style="color:#38a169"></i> ${r.created.length} observer code${r.created.length == 1 ? "" : "s"} created</h3></div><div class="muted" style="margin-bottom:10px">${r.skipped ? r.skipped + " polling unit" + (r.skipped == 1 ? "" : "s") + " already had enough observers. " : ""}Print the QR cards and hand them out. Type each observer's name in the <b>Name</b> box of the list whenever you have it.</div><div class="mono" style="max-height:160px;overflow:auto;font-size:12px;border:1px solid #e2e8f0;border-radius:8px;padding:8px;margin-bottom:12px">${r.created.map((c) => esc(c.code) + " · " + esc(c.lga) + " · PU " + esc(c.pu)).join("<br>")}</div>${(r.officers || []).filter((o) => o.code).length ? `<div style="background:#faf5ff;border:1px solid #d6bcfa;border-radius:8px;padding:8px;margin-bottom:12px"><b>Collation Officers created</b><div class="mono" style="font-size:12px;margin:4px 0">${r.officers.filter((o) => o.code).map((o) => esc(o.name) + " (" + esc(o.ward) + ") · " + esc(o.code) + " · " + esc(o.passcode)).join("<br>")}</div><button class="btn btn-sm btn-outline" id="bo"><i class="fas fa-print"></i> Print officer QR cards</button><div class="muted" style="font-size:11px;margin-top:4px">Passcodes are shown once.</div></div>` : ""}${(r.officers || []).some((o) => o.existing) ? '<div class="muted" style="margin-bottom:8px">A ward that already has an officer was left as it is.</div>' : ""}<div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn btn-primary" id="bq"><i class="fas fa-print"></i> Print QR cards</button><button class="btn btn-outline" id="bc"><i class="fas fa-file-csv"></i> Download list</button><button class="btn btn-outline" id="bd">Done</button></div></div>`;
        document.body.appendChild(w);
        w.querySelector("#bq").onclick = () => printCreds("Observer sign-in sheets", r.created.map((c) => ({ title: "Observer sign-in — PU " + c.pu, lines: [["Sign in at", ORIGIN.replace(/^https?:\/\//, "") + "/observer/ (or the Observer app)"], ["Code", c.code], ["Polling unit", [c.lga, c.ward, "PU " + c.pu].join(" / ")]], link: loginLink("obs", c.code) })));
        const bo = w.querySelector("#bo");
        if (bo) bo.onclick = () => printCreds("Collation officer sign-in sheets", r.officers.filter((o) => o.code).map((o) => ({ title: o.title + " — " + o.name, lines: [["Sign in at", ORIGIN.replace(/^https?:\/\//, "") + "/officer/"], ["Officer code", o.code], ["Passcode", o.passcode], ["Area", [o.lga, o.ward].join(" / ")]], link: loginLink("officer", o.code, o.passcode) })));
        w.querySelector("#bc").onclick = () => {
          const a = document.createElement("a");
          a.href = URL.createObjectURL(new Blob(["code,lga,ward,pu,pu_name,registered_voters,name\n" + r.created.map((c) => [c.code, c.lga, c.ward, c.pu, c.pu_name, c.reg, ""].map((v) => '"' + String(v).replace(/"/g, '""') + '"').join(",")).join("\n")], { type: "text/csv" }));
          a.download = "observer_codes.csv";
          a.click();
        };
        w.querySelector("#bd").onclick = () => w.remove();
      }
      async function setObsName(code, v) {
        try {
          await A.post("obs/" + code + "/name", { name: v });
          toast("✅ Name saved");
        } catch (e) {
          toast("⚠️ " + e.message);
        }
      }
      const obsCredOf = (code) => {
        const o = DATA.obs.find((x) => x.code == code) || {};
        return { title: "Observer sign-in" + (o.pu ? " — PU " + o.pu : ""), lines: [["Sign in at", ORIGIN.replace(/^https?:\/\//, "") + "/observer/ (or the Observer app)"], ["Code", code], ...(o.lga ? [["Polling unit", [o.lga, o.ward, "PU " + o.pu].join(" / ")]] : [])], link: loginLink("obs", code) };
      };
      const obsCred = (code) => credModal({ ...obsCredOf(code), note: "The observer scans this (or types the code), then chooses a PIN. The code locks to the first phone that uses it." });
      async function genCode() {
        const g = (i) => $("#" + i).value.trim();
        try {
          const r = await A.post("room/obs", {
            state: g("gs"),
            lga: g("gl"),
            ward: g("gw"),
            pu: g("gp"),
            reg: g("gr"),
            name: g("gn"),
          });
          obsCred(r.code);
          loadAll();
        } catch (e) {
          toast("⚠️ " + e.message);
        }
      }
      // ---- Collation Officers (ward / LGA) for this room's area ----
      let OFFS = null;
      async function offLoad() {
        try { OFFS = await A.get("officers"); } catch { OFFS = []; }
        render();
      }
      async function wardOfficer(lga, ward) {
        if (!OFFS) await offLoad();
        const eq = (a, b) => String(a || "").toLowerCase() == String(b || "").toLowerCase(),
          o = (OFFS || []).find((x) => x.level == "ward" && eq(x.lga, lga) && eq(x.ward, ward));
        o ? offView(o.id) : toast("ℹ️ No Ward Collation Officer has been assigned to this ward yet.");
      }
      const offView = (id) => officerCard(id);
      start("room", () => ({
        dash: ["Situation Room Dashboard", "building-columns", () => roomDash(ME.id, false)],
        res: ["Results & EC8A", "scale-balanced", () => cardSearch(0, DATA.obs) + '<div style="margin-top:20px">' + tabResults(false) + "</div>"],
        obs: ["Observer Manager", "user-gear", rObs],
        con: ["Contacts", "address-book", tabContacts],
        dat: ["Data Download", "download", tabData],
        share: ["Share Live View", "share-nodes", tabShare],
        help: ["Help", "circle-question", tabHelp],
      }));
    </script>
  </body>
</html>
