<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Situation Room · My Collation Center</title>
    <link
      rel="stylesheet"
      href="/vendor/fa/css/all.min.css"
    />
    <link
      href="/shared/fonts.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/vendor/leaflet/leaflet.css" />
    <link rel="stylesheet" href="/shared/style.css" />
  </head>
  <body>
    <div class="toast" id="toast"></div>
    <div id="app"></div>
    <script src="/vendor/leaflet/leaflet.js"></script>
    <script src="/vendor/qrcode.js"></script>
    <script src="/vendor/livekit-client.umd.js"></script>
    <script src="/vendor/read-excel-file.min.js"></script>
    <script src="/shared/ui.js"></script>
    <script>
      const rObs = () => {
        const all = DATA.obs;
        setTimeout(() => {
          locLoad("lga");
          if ($("#gl")?.value) locLoad("ward");
        }, 60);
        return `<div class="dashboard-grid"><div class="card"><div class="card-header"><h3><i class="fas fa-key"></i> Generate Observer Code</h3></div>${ME.room.state ? `<input type="hidden" id="gs" value="${esc(ME.room.state)}"><div class="fi" style="background:#f7fafc;color:#4a5568"><i class="fas fa-lock" style="font-size:11px"></i> State: <b>${esc(ME.room.state)}</b> <span class="muted">(fixed for this room)</span></div>` : `<select class="fi" id="gs" onchange="locLoad('lga')">${CFG.states.map((s) => `<option ${s == ME.room.state ? "selected" : ""}>${s}</option>`).join("")}</select>`}<input class="fi" id="gl" list="dl-lga" placeholder="${ME.room.scope && ME.room.scope.includes(",") ? "LGA (one of: " + esc(ME.room.scope.split(",").join(", ")) + ")" : "LGA"}" value="${esc(ME.room.scope && !ME.room.scope.includes(",") ? ME.room.scope : "")}" ${ME.room.scope && !ME.room.scope.includes(",") ? "readonly" : ""} onchange="locLoad('ward')"><datalist id="dl-lga"></datalist><input class="fi" id="gw" list="dl-ward" placeholder="Ward" onchange="locLoad('pu')"><datalist id="dl-ward"></datalist><input class="fi" id="gp" list="dl-pu" placeholder="PU code (e.g. 012)" onchange="puReg()"><datalist id="dl-pu"></datalist><input class="fi" id="gr" type="number" placeholder="Registered voters (default 500)"><input class="fi" id="gn" placeholder="Observer name (optional)"><button class="btn btn-primary" onclick="genCode()"><i class="fas fa-key"></i> Generate Code</button><div class="muted" style="margin-top:8px">The code is the ONLY login link. It binds one observer to this room and one PU. Generate two codes per PU: the two observers' figures are compared automatically. On first login the code locks to that phone with a PIN the observer chooses; use "Reset phone" if a phone is lost.</div></div>
<div class="card"><div class="card-header"><h3><i class="fas fa-users"></i> Observers (${all.length})</h3><button class="btn btn-sm btn-outline" onclick="printCreds('Observer sign-in sheets',flt(DATA.obs).filter(o=>o.active&&!o.bound).slice(0,400).map(o=>obsCredOf(o.code)))"><i class="fas fa-print"></i> Print QR sheet (unused codes)</button><input placeholder="Search code, name, PU…" value="${esc(F.q || "")}" onchange="setF('q',this.value)" style="padding:6px 10px;border-radius:8px;border:1px solid #cbd5e0"></div><div class="tw"><table><tr><th>Code</th><th>Name</th><th>Location</th><th>Reg.</th><th>Status</th><th>Phone</th><th>Tallies (hover = edit history)</th><th>Actions</th></tr>${flt(all).slice(0, 500).map((o) => `<tr><td class="mono">${esc(o.code)}</td><td>${esc(o.name)}</td><td>${esc(o.state)}/${esc(o.lga)}/${esc(o.ward)}/PU ${esc(o.pu)}</td><td>${o.reg}</td><td>${o.active ? pill(st(o)) : '<span class="pill r">Revoked</span>'}</td><td>${o.bound ? '<span class="pill g">Locked</span>' : '<span class="pill s">Not used yet</span>'}</td><td>${tallyCell(o)}</td><td><button class="btn btn-sm btn-outline" onclick="SEL='${o.code}';TAB='dash';render()">Feed</button> <button class="btn btn-sm btn-outline" onclick="navigator.clipboard?.writeText('${o.code}');toast('Copied')">Copy</button> <button class="btn btn-sm btn-outline" onclick="obsCred('${o.code}')"><i class="fas fa-qrcode"></i> QR</button> ${o.bound ? `<button class="btn btn-sm btn-outline" onclick="resetDev('${o.code}')">Reset phone</button> ` : ""}<button class="btn btn-sm ${o.active ? "btn-danger" : "btn-success"}" onclick="A.post('obs/${o.code}/toggle')">${o.active ? "Revoke" : "Activate"}</button></td></tr>`).join("")}</table></div></div></div>`;
      };
      let PUS = [];
      async function locLoad(next) {
        if (!CFG.loc) return;
        const s = $("#gs").value,
          l = $("#gl")?.value,
          w = $("#gw")?.value;
        try {
          if (next == "lga") {
            const mine = String(ME.room.scope || "").split(",").map((x) => x.trim().toLowerCase()).filter(Boolean);
            $("#dl-lga").innerHTML = (await A.get("locations?state=" + encodeURIComponent(s)))
              .filter((x) => !mine.length || mine.includes(x.lga.toLowerCase()))
              .map((x) => `<option>${esc(x.lga)}`)
              .join("");
          }
          if (next == "ward")
            $("#dl-ward").innerHTML = (
              await A.get("locations?state=" + encodeURIComponent(s) + "&lga=" + encodeURIComponent(l))
            )
              .map((x) => `<option>${esc(x.ward)}`)
              .join("");
          if (next == "pu") {
            PUS = await A.get(
              "locations?state=" +
                encodeURIComponent(s) +
                "&lga=" +
                encodeURIComponent(l) +
                "&ward=" +
                encodeURIComponent(w),
            );
            $("#dl-pu").innerHTML = PUS.map(
              (x) => `<option value="${esc(x.pu)}" label="${esc(x.name || "")}">`,
            ).join("");
          }
        } catch {}
      }
      const puReg = () => {
        const p = PUS.find((x) => x.pu == $("#gp").value);
        if (p) $("#gr").value = p.reg;
      };
      // an observer's sign-in card: the code + a QR that opens the Observer sign-in with the code filled in
      const obsCredOf = (code) => {
        const o = DATA.obs.find((x) => x.code == code) || {};
        return { title: "Observer sign-in" + (o.pu ? " — PU " + o.pu : ""), lines: [["Sign in at", ORIGIN.replace(/^https?:\/\//, "") + "/observer/ (or the Observer app)"], ["Code", code], ...(o.lga ? [["Polling unit", [o.lga, o.ward, "PU " + o.pu].join(" / ")]] : [])], link: loginLink("obs", code) };
      };
      const obsCred = (code) => credModal({ ...obsCredOf(code), note: "The observer scans this (or types the code), then chooses a PIN. The code locks to the first phone that uses it." });
      async function genCode() {
        const g = (i) => $("#" + i).value.trim();
        try {
          const r = await A.post("room/obs", {
            state: g("gs"),
            lga: g("gl"),
            ward: g("gw"),
            pu: g("gp"),
            reg: g("gr"),
            name: g("gn"),
          });
          obsCred(r.code);
          loadAll();
        } catch (e) {
          toast("⚠️ " + e.message);
        }
      }
      start("room", () => ({
        dash: ["Situation Room Dashboard", "building-columns", () => roomDash(ME.id, false)],
        res: ["Results & EC8A", "scale-balanced", () => cardSearch(0, DATA.obs) + '<div style="margin-top:20px">' + tabResults(false) + "</div>"],
        obs: ["Observer Manager", "user-gear", rObs],
        con: ["Contacts", "address-book", tabContacts],
        dat: ["Data Download", "download", tabData],
        share: ["Share Live View", "share-nodes", tabShare],
        help: ["Help", "circle-question", tabHelp],
      }));
    </script>
  </body>
</html>
