<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Command Center · My Collation Center</title>
    <link
      rel="stylesheet"
      href="/vendor/fa/css/all.min.css"
    />
    <link
      href="/shared/fonts.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/vendor/leaflet/leaflet.css" />
    <link rel="stylesheet" href="/shared/style.css" />
  </head>
  <body>
    <div class="toast" id="toast"></div>
    <div id="app"></div>
    <script src="/vendor/leaflet/leaflet.js"></script>
    <script src="/vendor/livekit-client.umd.js"></script>
    <script src="/vendor/read-excel-file.min.js"></script>
    <script src="/vendor/qrcode.js"></script>
    <script src="/shared/ui.js"></script>
    <script>
      const cRooms =
        () => `${NEWPASS ? `<div class="card" style="border-color:#d69e2e;margin-bottom:20px"><b>🔑 Passcode for ${esc(NEWPASS.id)}: <span class="mono" style="font-size:18px">${esc(NEWPASS.p)}</span></b><div class="muted">Shown once only — it is stored hashed. Give it to the room operator.</div><button class="btn btn-outline btn-sm" style="margin-top:8px;width:120px" onclick="NEWPASS=null;render()">Done</button></div>` : ""}
<div class="dashboard-grid"><div class="card"><div class="card-header"><h3><i class="fas fa-plus"></i> Create Situation Room</h3></div><input class="fi" id="rn" placeholder="Room name"><select class="fi" id="rs">${CFG.states.map((s) => `<option ${ME.tenantState==s?"selected":""}>${s}</option>`).join("")}</select><input class="fi" id="rl" placeholder="LGA scope (comma separated)"><input class="fi" id="ro" placeholder="Operator"><button class="btn btn-primary" onclick="newRoom()"><i class="fas fa-plus"></i> Create Room</button><div class="muted" style="margin-top:8px">Rooms start inactive. A room ID and passcode are generated by the server.</div>
<div class="card-header" style="margin-top:18px"><h3><i class="fas fa-layer-group"></i> One room per LGA</h3></div><select class="fi" id="bs">${CFG.states.map((s) => `<option ${(ME.tenantState||"Kano") == s ? "selected" : ""}>${s}</option>`).join("")}</select><label class="muted" style="margin-bottom:8px"><input type="checkbox" id="ba"> Activate them now</label><button class="btn btn-outline" onclick="bulkRooms()"><i class="fas fa-layer-group"></i> Create a room for every LGA</button><div class="muted" style="margin-top:8px">Kano: 44 rooms. Each room can only issue observer codes inside its own LGA. LGAs that already have a room are skipped. The passcodes are downloaded once as a CSV - keep it safe.</div></div>
<div class="card"><div class="card-header"><h3><i class="fas fa-building-columns"></i> Situation Rooms (${DATA.rooms.length})</h3></div><div class="tw"><table><tr><th>Room</th><th>State</th><th>Operator</th><th>Status</th><th>Link</th><th>Obs</th><th>Actions</th></tr>${DATA.rooms.map((r) => `<tr><td><b>${esc(r.name)}</b><br><span class="muted">${r.id}</span></td><td><select onchange="A.f('rooms/${r.id}',{method:'PATCH',body:{state:this.value}})">${CFG.states.map((s) => `<option ${s == r.state ? "selected" : ""}>${s}</option>`).join("")}</select></td><td>${esc(r.operator)}</td><td>${pill(r.status)}</td><td>${r.pend ? '<span class="pill a">Sync pending</span>' : pill(r.online ? "Online" : "Offline")}</td><td>${r.obs}</td><td>${r.status != "active" ? `<button class="btn btn-sm btn-success" onclick="rs('${r.id}','active')">Activate</button>` : `<button class="btn btn-sm btn-warn" onclick="rs('${r.id}','suspended')">Suspend</button> <button class="btn btn-sm btn-danger" onclick="rs('${r.id}','inactive')">Deactivate</button>`} <button class="btn btn-sm btn-outline" onclick="DRILL='${r.id}';TAB='drill';F={};fit=true;render()">Drill</button> <button class="btn btn-sm btn-outline" onclick="renameRoom('${r.id}','${esc(r.name).replace(/'/g,"")}')">Rename</button> <button class="btn btn-sm btn-outline" onclick="resetP('${r.id}')">New passcode</button></td></tr>`).join("")}</table></div></div></div>`;
      const rs = (id, s) => A.post("rooms/" + id + "/status", { status: s }).then(() => toast("Room " + s));
      async function newRoom() {
        const g = (i) => $("#" + i).value.trim();
        try {
          const r = await A.post("rooms", {
            name: g("rn"),
            state: g("rs"),
            scope: g("rl"),
            operator: g("ro"),
          });
          NEWPASS = { id: r.id, p: r.passcode };
        } catch (e) {
          toast("⚠️ " + e.message);
        }
      }
      async function bulkRooms() {
        const st = $("#bs").value;
        if (!confirm("Create one Situation Room for every LGA in " + st + "?")) return;
        try {
          const r = await A.post("rooms/bulk", { state: st, activate: $("#ba").checked });
          if (r.created.length) {
            const csv = "room_id,name,lga,passcode\n" + r.created.map((x) => [x.id, x.name, x.lga, x.passcode].join(",")).join("\n");
            const a = document.createElement("a");
            a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv" }));
            a.download = st + "_room_passcodes.csv";
            a.click();
          }
          toast("✅ " + r.created.length + " rooms created" + (r.skipped ? ", " + r.skipped + " already existed" : "") + ". Passcodes downloaded.");
          loadAll();
        } catch (e) {
          toast("⚠️ " + e.message);
        }
      }
      async function renameRoom(id, cur) {
        const n = prompt("New Situation Room name (shown on its banner and on the observer app):", cur);
        if (n && n.trim()) A.f("rooms/" + id, { method: "PATCH", body: { name: n.trim() } }).then(() => { toast("✅ Renamed."); loadAll(); }).catch((e) => toast("⚠️ " + e.message));
      }
      async function resetP(id) {
        if (!confirm("Generate a new passcode for " + id + "? The old one stops working.")) return;
        const r = await A.post("rooms/" + id + "/reset");
        NEWPASS = { id, p: r.passcode };
        render();
      }
      function cObs() {
        const l = flt(DATA.obs);
        MS = { l, inc: DATA.inc.filter((i) => !F.room || i.room_id == F.room), rooms: 1 };
        return `<div class="dashboard-grid"><div class="col">${cardSearch(1, DATA.obs)}${cardMap(l, "<span>🟦 Room</span>")}</div><div class="col">${cardFeed(0)}<div class="card"><div class="card-header"><h3><i class="fas fa-users"></i> Observers (${l.length})</h3>${l.length > 300 ? '<span class="tag">first 300 shown - narrow with the search</span>' : ""}</div><div class="tw" style="max-height:340px;overflow-y:auto"><table><tr><th>Code</th><th>Room</th><th>Location</th><th>Status</th><th>Tallies (hover = edit history)</th><th></th></tr>${l.slice(0, 300).map((o) => `<tr><td class="mono">${esc(o.code)}</td><td>${esc(o.room_id)}</td><td>${esc(o.lga)}/PU ${esc(o.pu)}</td><td>${o.active ? pill(st(o)) : '<span class="pill r">Revoked</span>'}</td><td>${tallyCell(o)}</td><td><button class="btn btn-sm btn-outline" onclick="SEL='${o.code}';fit=1;${o.lat != null ? `pinpoint(${o.lat},${o.lng});` : ""}render()">View</button> <button class="btn btn-sm btn-primary" onclick="msgTo('obs:${o.code}',prompt('Talkback message to ${o.code}:'))">Talk</button> <button class="btn btn-sm btn-danger" onclick="liveReq('${o.code}',${!o.live_req})">${o.live_req ? "End live" : "Live"}</button> ${o.bound ? `<button class="btn btn-sm btn-outline" onclick="resetDev('${o.code}')">Reset phone</button> ` : ""}<button class="btn btn-sm btn-outline" onclick="A.post('obs/${o.code}/toggle')">${o.active ? "Revoke" : "Activate"}</button></td></tr>`).join("")}</table></div></div></div></div>`;
      }
      const cBc =
        () => `<div class="dashboard-grid"><div class="card"><div class="card-header"><h3><i class="fas fa-bullhorn"></i> Broadcast Console</h3></div><textarea class="fi" id="bm" rows="4" placeholder="Message…"></textarea><select class="fi" id="bt"><option value="ALL_ROOMS">All Situation Rooms</option><option value="SUB">Selected rooms</option><option value="ALL_OBS">ALL observers (emergency alert)</option></select><div style="display:flex;flex-wrap:wrap;gap:10px;margin-bottom:10px">${DATA.rooms.map((r) => `<label class="tag"><input type="checkbox" class="bk" value="${r.id}"> ${esc(r.name)}</label>`).join("")}</div><button class="btn btn-danger" onclick="doBc()"><i class="fas fa-bullhorn"></i> Send Broadcast</button></div>
<div class="col"><div class="card"><div class="card-header"><h3><i class="fas fa-check-double"></i> Receipt Tracking</h3></div><div class="contact-list">${DATA.bc.map((m) => `<div class="contact-item"><div class="info"><div class="role">${esc(m.text)}</div><div class="loc">${esc(m.to_scope)} · ${DT(m.ts)}</div></div><span class="tag">${m.ack.length}/${m.targets} ack</span></div>`).join("") || '<div class="muted">Nothing sent.</div>'}</div></div>
<div class="card"><div class="card-header"><h3><i class="fas fa-inbox"></i> Inbox</h3></div><div class="contact-list">${
          DATA.msg
            .filter((m) => m.to_scope == "CMD")
            .map(
              (m) =>
                `<div class="contact-item"><div class="info"><div class="role">${esc(m.from_id)}</div><div>${esc(m.text)}</div><div class="loc">${TM(m.ts)}</div></div><button class="btn btn-sm btn-outline" onclick="msgTo('room:${esc(m.from_id)}',prompt('Reply:'))">Reply</button></div>`,
            )
            .join("") || '<div class="muted">No messages.</div>'
        }</div></div></div></div>`;
      async function doBc() {
        const ids = [...document.querySelectorAll(".bk:checked")].map((x) => x.value),
          t = $("#bt").value;
        if (t == "SUB" && !ids.length) return toast("⚠️ Select at least one room.");
        try {
          await A.post("broadcast", { target: t, ids, text: $("#bm").value });
          toast("📢 Broadcast sent.");
          $("#bm").value = "";
        } catch (e) {
          toast("⚠️ " + e.message);
        }
      }
      const cCol = () =>
        cardSearch(1, DATA.obs) + '<div style="margin-top:20px">' + cardColl() + "</div>";
      const cLoc =
        () => `<div class="card" style="max-width:760px"><div class="card-header"><h3><i class="fas fa-map"></i> States · LGAs · Wards · Polling Units</h3></div><div class="muted" style="margin-bottom:12px">Status: ${CFG.loc ? "dataset loaded — rooms pick State → LGA → Ward → PU from cascading lists" : "no dataset yet (rooms type locations manually)"}.</div>
<button class="btn btn-primary" onclick="locFetch('')"><i class="fas fa-database"></i> Load bundled national dataset</button><div class="muted" style="margin:6px 0 14px">37 states, 774 LGAs, ~8,800 wards and ~118,500 PU names (no INEC PU codes or voter counts: PUs are numbered within each ward and registered voters default to 500; set the real figure per observer).</div>
<input class="fi" id="lu" placeholder="Or fetch JSON from a URL (e.g. a CredibleVoteNG export / your own file URL)"><button class="btn btn-outline" onclick="locFetch($('#lu').value.trim())"><i class="fas fa-cloud-arrow-down"></i> Fetch from URL</button>
<div class="muted" style="margin:14px 0 6px">Or upload a file: CSV <span class="mono">state,lga,ward,pu,reg,name</span> or JSON (nested state→lgas→wards→polling_units, or a flat list of objects). Replaces the current dataset.</div><input class="fi" type="file" id="lf" accept=".csv,.json"><button class="btn btn-outline" onclick="impLoc()"><i class="fas fa-upload"></i> Import file</button></div>`;
      async function locFetch(u) {
        toast("⏳ Loading… this can take up to a minute.");
        try {
          const r = await A.post("locations/fetch", u ? { url: u } : {});
          CFG = await A.get("config");
          toast("✅ " + r.lgas + " LGAs, " + r.wards + " wards, " + r.pus + " PUs loaded.");
          render();
        } catch (e) {
          toast("⚠️ " + e.message);
        }
      }
      async function impLoc() {
        const f = $("#lf").files[0];
        if (!f) return toast("Choose a file.");
        try {
          const j = f.name.endsWith(".json"),
            r = await A.f("locations/import", {
              method: "POST",
              body: new Blob([await f.text()]),
              headers: { "Content-Type": j ? "application/json" : "text/csv" },
            });
          CFG = await A.get("config");
          toast("✅ " + r.pus + " PUs loaded (" + r.skipped + " skipped).");
          render();
        } catch (e) {
          toast("⚠️ " + e.message);
        }
      }
      const cSet = () => {
        const s = DATA.set || {},
          h = s.hooks || {};
        return `<div class="dashboard-grid"><div class="col"><div class="card"><div class="card-header"><h3><i class="fas fa-gear"></i> App Settings</h3></div>${ME.su ? `<div class="muted" style="margin:0 0 6px">Platform name (platform administrator) — shown on login screens before anyone signs in.</div><input class="fi" id="pnm" maxlength="60" value="${esc(s.platformName || "")}"><button class="btn btn-outline" style="margin-bottom:14px" onclick="sv_({platformName:$('#pnm').value},'✅ Platform name updated.')">Save platform name</button>` : ""}<div class="muted" style="margin-bottom:6px">App name for this Command Center — shown on its signed-in screens, the top bar, the browser tab and the observer app.</div><input class="fi" id="sn" maxlength="60" value="${esc(s.appName || CFG.appName)}"><button class="btn btn-primary" onclick="saveName()"><i class="fas fa-floppy-disk"></i> Save name</button></div>
<div class="card"><div class="card-header"><h3><i class="fas fa-lock"></i> Change Command passcode</h3></div><input class="fi" id="po" type="password" placeholder="Current passcode"><input class="fi" id="pn" type="password" placeholder="New passcode (min 8 characters)"><button class="btn btn-primary" onclick="savePass()">Change passcode</button></div>${cTotp()}${ME.su ? cBackup() : ""}</div>
<div class="col"><div class="card"><div class="card-header"><h3><i class="fas fa-users-gear"></i> Command operators</h3></div><div class="muted" style="margin-bottom:8px">Each operator logs in with their own name and passcode; every action is audit-logged under that name.</div>${(DATA.cu || []).map((u) => `<div class="contact-item"><div class="info"><div class="role">${esc(u.name)}</div><div class="loc">${u.active ? "active" : "disabled"}</div></div><div>${u.totp ? `<button class="btn btn-sm btn-outline" onclick="if(confirm('Clear two-step login for ${esc(u.name)}?'))A.post('cmdusers/${u.id}/totp-reset').then(()=>{toast('Cleared');loadAll()}).catch(e=>toast('⚠️ '+e.message))">Clear 2-step</button> ` : ""}<button class="btn btn-sm btn-outline" onclick="cuReset(${u.id})">Reset passcode</button> <button class="btn btn-sm ${u.active ? "btn-danger" : "btn-success"}" onclick="A.post('cmdusers/${u.id}/toggle').then(loadAll).catch(e=>toast('⚠️ '+e.message))">${u.active ? "Disable" : "Enable"}</button></div></div>`).join("")}<input class="fi" id="un" placeholder="New operator name" style="margin-top:8px"><input class="fi" id="up" type="password" placeholder="Passcode (min 8 characters)"><button class="btn btn-primary" onclick="cuAdd()"><i class="fas fa-user-plus"></i> Add operator</button></div><div class="card"><div class="card-header"><h3><i class="fas fa-share-nodes"></i> Feed-sharing webhooks</h3></div><div class="muted" style="margin-bottom:6px">When a room or Command shares a feed, the server POSTs the observer details (JSON) to the URL set here. Leave blank to log only.</div>${["CP Command", "INEC", "NSCDC", "Dispatch"].map((n, i) => `<input class="fi hk" data-n="${n}" placeholder="${n} webhook URL" value="${esc(h[n] || "")}">`).join("")}<button class="btn btn-primary" onclick="saveHooks()">Save webhooks</button></div>
<div class="card"><div class="card-header"><h3><i class="fas fa-cloud"></i> Cloud sync (optional)</h3></div><input class="fi" id="cu" placeholder="Endpoint URL (receives JSON via POST)" value="${esc(s.cloudUrl || "")}"><input class="fi" id="ct" type="password" placeholder="Bearer token (optional)" value="${esc(s.cloudToken || "")}"><input class="fi" id="cm" type="number" min="0" placeholder="Auto-sync every N minutes (0 = manual)" value="${s.cloudMins || 0}"><div style="display:flex;gap:8px"><button class="btn btn-primary" onclick="saveCloud()">Save</button><button class="btn btn-outline" onclick="cloudNow()"><i class="fas fa-rotate"></i> Sync now</button></div></div></div></div>`;
      };
      // two-step login (authenticator app) for the signed-in operator
      let TSET = null;
      const cTotp = () =>
        `<div class="card"><div class="card-header"><h3><i class="fas fa-mobile-screen"></i> Two-step login</h3>${DATA.totp?.on ? pill("active") : '<span class="pill a">Off</span>'}</div>${
          DATA.totp?.on
            ? `<div class="muted" style="margin-bottom:8px">On. Logging in needs your passcode and the 6-digit code from your authenticator app.</div><input class="fi" id="tc" inputmode="numeric" maxlength="6" placeholder="Current 6-digit code"><button class="btn btn-outline" onclick="totpOff()">Turn off</button>`
            : TSET
              ? `<div class="muted" style="margin-bottom:8px">Scan with Google Authenticator / Microsoft Authenticator / Authy, or type the key, then enter the 6-digit code shown.</div><div style="background:#fff;padding:8px;width:max-content">${window.qrcode ? (() => { const q = qrcode(0, "M"); q.addData(TSET.uri); q.make(); return q.createSvgTag(4); })() : ""}</div><div class="mono" style="margin:8px 0;word-break:break-all">${esc(TSET.secret)}</div><input class="fi" id="tc" inputmode="numeric" maxlength="6" placeholder="6-digit code"><button class="btn btn-primary" onclick="totpOn()">Turn on</button>`
              : `<div class="muted" style="margin-bottom:8px">Recommended for every Command operator: a stolen passcode alone cannot open the Command Center.</div><button class="btn btn-primary" onclick="A.post('totp/setup').then(r=>{TSET=r;render()}).catch(e=>toast('⚠️ '+e.message))">Set up</button>`
        }</div>`;
      const totpOn = () =>
        A.post("totp/enable", { code: $("#tc").value.trim() })
          .then(() => {
            TSET = null;
            toast("✅ Two-step login is on.");
            loadAll();
          })
          .catch((e) => toast("⚠️ " + e.message));
      const totpOff = () =>
        A.post("totp/disable", { code: $("#tc").value.trim() })
          .then(() => {
            toast("Two-step login turned off.");
            loadAll();
          })
          .catch((e) => toast("⚠️ " + e.message));
      // automatic backups of the database on this PC (platform administrator)
      const cBackup = () => {
        const b = DATA.bk;
        return `<div class="card"><div class="card-header"><h3><i class="fas fa-hard-drive"></i> Backups on this PC</h3><button class="btn btn-sm btn-primary" onclick="toast('⏳ Backing up…');A.post('backups').then(r=>{toast('✅ '+r.name);loadAll()}).catch(e=>toast('⚠️ '+e.message))">Back up now</button></div><div class="muted" style="margin-bottom:8px">${b ? (b.every ? "Automatic every " + b.every + " min, newest " + b.keep + " kept" : "Automatic backups off (BACKUP_MINS=0)") + " · folder <span class='mono'>" + esc(b.dir) + "</span>. Video clips, EC8A photos and radio audio are files in the same data folder - copy the whole folder to an external drive." : "Unavailable"}</div><div class="contact-list">${(b?.files || []).slice(0, 12).map((f) => `<div class="contact-item"><div class="info"><div class="role mono">${esc(f.name)}</div><div class="loc">${(f.size / 1048576).toFixed(1)} MB</div></div><button class="btn btn-sm btn-outline" onclick="A.dl('backups/${f.name}','${f.name}')"><i class="fas fa-download"></i></button></div>`).join("") || '<div class="muted">No backups yet.</div>'}</div></div>`;
      };
      const sv_ = (b, m) =>
        A.post("settings", b)
          .then(() => {
            toast(m);
            return loadAll();
          })
          .catch((e) => toast("⚠️ " + e.message));
      async function saveName() {
        await sv_({ appName: $("#sn").value }, "✅ App name updated everywhere.");
        CFG = await A.get("config");
        document.title = CFG.appName + " · Command Center";
        render();
      }
      const savePass = () =>
        A.post("settings/passcode", { old: $("#po").value, pass: $("#pn").value })
          .then(() => {
            toast("✅ Passcode changed.");
            $("#po").value = $("#pn").value = "";
          })
          .catch((e) => toast("⚠️ " + e.message));
      const saveHooks = () =>
        sv_(
          {
            hooks: Object.fromEntries(
              [...document.querySelectorAll(".hk")]
                .filter((x) => x.value.trim())
                .map((x) => [x.dataset.n, x.value.trim()]),
            ),
          },
          "✅ Webhooks saved.",
        );
      const saveCloud = () =>
        sv_(
          { cloudUrl: $("#cu").value.trim(), cloudToken: $("#ct").value, cloudMins: $("#cm").value },
          "✅ Cloud settings saved.",
        );
      const cuAdd = () =>
        A.post("cmdusers", { name: $("#un").value, pass: $("#up").value })
          .then(() => {
            toast("✅ Operator added.");
            loadAll();
          })
          .catch((e) => toast("⚠️ " + e.message));
      const cuReset = (id) => {
        const p = prompt("New passcode for this operator (min 8 characters):");
        if (p)
          A.post("cmdusers/" + id + "/reset", { pass: p })
            .then(() => toast("✅ Passcode reset."))
            .catch((e) => toast("⚠️ " + e.message));
      };
      const cTn =
        () => `<div class="dashboard-grid"><div class="card"><div class="card-header"><h3><i class="fas fa-sitemap"></i> New Command Center</h3></div><div class="muted" style="margin-bottom:8px">Each Command Center has its own rooms, observers, operators, data, settings and audit log, and cannot see any other Command Center.</div><input class="fi" id="tn_n" placeholder="Command Center name (e.g. Kano State Command)"><select class="fi" id="tn_s"><option value="">State (optional) — auto-fills its LGAs/wards/PUs</option>${CFG.states.map((x)=>`<option>${x}</option>`).join("")}</select><input class="fi" id="tn_o" placeholder="First operator name"><input class="fi" id="tn_p" type="password" placeholder="Operator passcode (min 8 characters)"><button class="btn btn-primary" onclick="tnAdd()"><i class="fas fa-plus"></i> Create Command Center</button></div>
<div class="card"><div class="card-header"><h3>Command Centers (${DATA.tn.length})</h3></div><div class="tw"><table><tr><th>ID</th><th>Name</th><th>State</th><th>Rooms</th><th>Operators</th><th>Status</th><th></th></tr>${DATA.tn.map((t) => `<tr><td class="mono">${esc(t.id)}</td><td><b>${esc(t.name)}</b></td><td>${esc(t.state || "—")}</td><td>${t.rooms}</td><td>${t.operators}</td><td>${pill(t.active ? "active" : "inactive")}</td><td><button class="btn btn-sm ${t.active ? "btn-danger" : "btn-success"}" onclick="A.post('tenants/${t.id}/toggle').then(()=>{toast('Updated');loadAll()}).catch(e=>toast('⚠️ '+e.message))">${t.active ? "Disable (suspends its rooms)" : "Enable"}</button></td></tr>`).join("")}</table></div></div></div>`;
      const tnAdd = () =>
        A.post("tenants", { name: $("#tn_n").value, state: $("#tn_s").value, operator: $("#tn_o").value, pass: $("#tn_p").value })
          .then((r) => {
            toast("✅ Command Center " + r.id + " created.");
            loadAll();
          })
          .catch((e) => toast("⚠️ " + e.message));
      const cloudNow = () =>
        A.post("cloudsync")
          .then(() => toast("☁️ Synced."))
          .catch((e) => toast("⚠️ " + e.message));
      start("cmd", () => ({
        rooms: ["Situation Rooms", "building-columns", cRooms],
        obs: ["Observers & Map", "location-dot", cObs],
        bc: ["Broadcast", "bullhorn", cBc],
        col: ["Global Collation", "chart-column", cCol],
        res: ["Results Review", "scale-balanced", () => cardSearch(1, DATA.obs) + '<div style="margin-top:20px">' + tabResults(true) + "</div>"],
        dat: ["Export & Archive", "download", tabData],
        con: ["Contacts", "address-book", tabContacts],
        ...(ME.su ? { loc: ["Locations", "map", cLoc], tn: ["Command Centers", "sitemap", cTn] } : {}),
        aud: ["Audit Log", "clipboard-list", tabAudit],
        set: ["App Settings", "gear", cSet],
      }));
    </script>
