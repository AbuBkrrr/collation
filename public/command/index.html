<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Command Center · My Collation Center</title>
    <link
      rel="stylesheet"
      href="/vendor/fa/css/all.min.css"
    />
    <link
      href="/shared/fonts.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/vendor/leaflet/leaflet.css" />
    <link rel="stylesheet" href="/shared/style.css" />
  </head>
  <body>
    <div class="toast" id="toast"></div>
    <div id="app"></div>
    <script src="/vendor/leaflet/leaflet.js"></script>
    <script src="/vendor/qrcode.js"></script>
    <script src="/vendor/qrcode.js"></script>
    <script src="/shared/ui.js"></script>
    <script>
      const cRooms =
        () => `${NEWPASS ? `<div class="card" style="border-color:#d69e2e;margin-bottom:20px"><b>🔑 Passcode for ${esc(NEWPASS.id)}: <span class="mono" style="font-size:18px">${esc(NEWPASS.p)}</span></b><div class="muted">Shown once only — it is stored hashed. Give it to the room operator: they sign in at <b>${ORIGIN.replace(/^https?:\/\//, "")}/room/</b> with this Room ID and passcode, or simply scan the QR.${NEWPASS.inactive ? " <b>This room is not active yet — press Activate on its row before they sign in.</b>" : ""}</div><div style="display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-top:10px"><div style="line-height:0;border:1px solid #e2e8f0;border-radius:10px;padding:4px;background:#fff">${qrSvg(loginLink("room", NEWPASS.id, NEWPASS.p), 3)}</div><div style="display:flex;flex-direction:column;gap:8px"><button class="btn btn-primary btn-sm" onclick="roomCred(NEWPASS,1)"><i class="fas fa-qrcode"></i> Share / print with QR</button><button class="btn btn-outline btn-sm" onclick="NEWPASS=null;render()">Done</button></div></div></div>` : ""}
<div class="dashboard-grid side"><div class="card"><div class="card-header"><h3><i class="fas fa-plus"></i> Create Situation Room</h3></div><div class="muted" style="margin-bottom:8px">Choose the election: <b>LGA</b> chairman (one LGA), <b>Governor</b> or <b>Presidential</b> (whole state), or <b>Senator</b>, <b>House of Reps</b> or a <b>custom zone</b> (you pick the LGAs it covers).</div><input class="fi" id="rn" value="${esc(NEWNM)}" oninput="NEWNM=this.value" placeholder="${NEWK == "lga" ? "Room name (blank = “&lt;LGA&gt; LGA Situation Room”)" : "Zone / room name (e.g. Kano Central Senatorial District)"}"><select class="fi" id="rk" onchange="rkPick(this.value)" title="Who is this room for?">${rkOptions()}</select><div class="muted" style="margin:-2px 0 6px">Type of election: <b>${RKINDS[NEWK][2]}</b>${RKINDS[NEWK][3] ? " · covers the whole state" : ""}</div>${ME.tenantState ? `<input type="hidden" id="rs" value="${esc(ME.tenantState)}"><div class="fi" style="background:#f7fafc;color:#4a5568"><i class="fas fa-lock" style="font-size:11px"></i> State: <b>${esc(ME.tenantState)}</b> <span class="muted">(fixed for this Command Center)</span></div>` : `<select class="fi" id="rs" onchange="NEWST=this.value;NEWLGAS.clear();RLG.st=null;render()"><option value="">Choose the state…</option>${CFG.states.map((s) => `<option ${NEWST == s ? "selected" : ""}>${s}</option>`).join("")}</select>`}${roomLgaPicker()}<input class="fi" id="ro" value="${esc(NEWOP)}" oninput="NEWOP=this.value" placeholder="${RKINDS[NEWK][1]}"><input class="fi" id="ro_n" placeholder="${NEWK == "lga" ? "LGA Collation Officer — name (required)" : "State Collation Officer — name (needed once for this centre)"}"><input class="fi" id="ro_p" type="tel" placeholder="Collation Officer — phone"><button class="btn btn-primary" onclick="newRoom()"><i class="fas fa-plus"></i> Create Room</button><div class="muted" style="margin-top:8px">Rooms start inactive. A room ID and passcode are generated by the server.</div>
<div class="card-header" style="margin-top:18px"><h3><i class="fas fa-layer-group"></i> One room per LGA</h3></div>${bulkState()}<label class="muted" style="margin-bottom:8px"><input type="checkbox" id="ba"> Activate them now</label><button class="btn btn-outline" onclick="bulkRooms()"><i class="fas fa-layer-group"></i> Create a room for every LGA</button><div class="muted" style="margin-top:8px">${rmState() ? esc(rmState()) + ": one room for each of its " + (rmLgas().length || "") + " LGAs" : "One room for each LGA of the state"}. Each room can only issue observer codes inside its own LGA. LGAs that already have a room are skipped. The passcodes are downloaded once as a CSV - keep it safe.</div></div>
<div class="card"><div class="card-header"><h3><i class="fas fa-building-columns"></i> Situation Rooms (${DATA.rooms.length})</h3><button class="btn btn-sm btn-outline" onclick="officerSheet()"><i class="fas fa-clipboard-check"></i> Officer sign-ins</button>${DATA.rooms.length ? `<button class="btn btn-sm btn-primary" onclick="dlPasscodes()"><i class="fas fa-download"></i> Reset &amp; download all passcodes</button>` : ""}</div><div class="tw"><table><tr><th>Room</th><th>State</th><th>Operator</th><th>Status</th><th>Link</th><th>Obs</th><th>Actions</th></tr>${DATA.rooms.map((r) => `<tr><td><b>${esc(r.name)}</b><br><span class="muted">${r.id}</span></td><td>${ME.tenantState ? esc(r.state) + (r.scope || (r.kind && r.kind != "lga") ? `<br><span class="muted" title="${esc(r.scope || "")}">${r.kind && r.kind != "lga" ? "<b>" + KNAME[r.kind] + "</b> · " + (r.scope ? r.scope.split(",").length + " LGAs: " : "whole state") : ""}${esc((r.scope || "").split(",").join(", ").slice(0, 60))}${(r.scope || "").length > 60 ? "…" : ""}</span>` : "") : `<select onchange="A.f('rooms/${r.id}',{method:'PATCH',body:{state:this.value}})">${CFG.states.map((s) => `<option ${s == r.state ? "selected" : ""}>${s}</option>`).join("")}</select>`}</td><td>${esc(r.operator)}</td><td>${pill(r.status)}</td><td>${r.pend ? '<span class="pill a">Sync pending</span>' : pill(r.online ? "Online" : "Offline")}</td><td>${r.obs}</td><td><button class="btn btn-sm btn-outline" onclick="rmView('${r.id}')"><i class="fas fa-qrcode"></i> Sign-in</button> <button class="btn btn-sm btn-outline" onclick="rmOfficer('${r.id}')"><i class="fas fa-clipboard-check"></i> Officer</button> ${r.status != "active" ? `<button class="btn btn-sm btn-success" onclick="rs('${r.id}','active')">Activate</button>` : `<button class="btn btn-sm btn-warn" onclick="rs('${r.id}','suspended')">Suspend</button> <button class="btn btn-sm btn-danger" onclick="rs('${r.id}','inactive')">Deactivate</button>`} <button class="btn btn-sm btn-outline" onclick="DRILL='${r.id}';TAB='drill';F={};fit=true;render()">Drill</button> <button class="btn btn-sm btn-outline" onclick="renameRoom('${r.id}','${esc(r.name).replace(/'/g,"")}')">Rename</button> <button class="btn btn-sm btn-outline" onclick="resetP('${r.id}')">New passcode</button>${ME.su ? ` <button class="btn btn-sm btn-outline" onclick="rmArchive('${r.id}',true)"><i class="fas fa-box-archive"></i> Archive</button> <button class="btn btn-sm btn-danger" onclick="rmDelete('${r.id}')"><i class="fas fa-trash"></i> Delete</button>` : ""}</td></tr>`).join("")}</table></div></div></div>`;
      const rs = (id, s) => A.post("rooms/" + id + "/status", { status: s }).then(() => toast("Room " + s));
      // who a Situation Room is for, and so how many LGAs it covers
      // type of election -> who the room is for. [label, operator placeholder, election type, whole state?]
      const RKINDS = {
        lga: ["LGA Chairman", "Operator name (e.g. the LGA chairman's coordinator)", "LGA", false],
        governor: ["Governor", "Operator name (e.g. the governorship campaign coordinator)", "State", true],
        president: ["Presidential", "Operator name (e.g. the presidential campaign coordinator)", "Federal", true],
        senate: ["Senator — senatorial district (several LGAs)", "Operator name (e.g. the senator's coordinator)", "Federal", false],
        reps: ["House of Reps — federal constituency (several LGAs)", "Operator name (e.g. the member's coordinator)", "Federal", false],
        zone: ["Custom zone — any LGAs you choose", "Operator name", "Other", false],
      };
      const KNAME = { senate: "Senatorial District", reps: "Federal Constituency", zone: "Zone", governor: "Governorship", president: "Presidential" };
      const rkOptions = () => [["LGA election", ["lga"]], ["State election", ["governor"]], ["Federal election", ["president", "senate", "reps"]], ["Other", ["zone"]]].map(([g, ks]) => `<optgroup label="${g}">${ks.map((k) => `<option value="${k}" ${NEWK == k ? "selected" : ""}>${RKINDS[k][0]}</option>`).join("")}</optgroup>`).join("");
      let NEWK = "lga", NEWNM = "", NEWOP = "", NEWST = "", NEWTXT = "";
      const NEWLGAS = new Set(),
        RLG = { st: null, list: [] };
      const rmState = () => ME.tenantState || NEWST;
      // the LGAs to choose from: the locked state's, or the state chosen in the form (loaded when chosen)
      const rmLgas = () => (ME.tenantState ? DATA.lgas || [] : RLG.st === NEWST ? RLG.list : []);
      async function rlgLoad() {
        const st = NEWST;
        if (ME.tenantState || !st || RLG.st === st) return;
        RLG.st = st;
        RLG.list = (await A.get("locations?state=" + encodeURIComponent(st)).catch(() => [])).map((x) => x.lga);
        render();
      }
      function rkPick(v) {
        NEWK = v;
        if (v == "lga" && NEWLGAS.size > 1) NEWLGAS.clear();
        render();
      }
      function lgaPick(el) {
        if (el.type == "radio") NEWLGAS.clear();
        el.checked ? NEWLGAS.add(el.value) : NEWLGAS.delete(el.value);
        if ($("#lgan") && NEWK != "lga") $("#lgan").textContent = "· " + NEWLGAS.size + " ticked";
      }
      function lgaAll(on) {
        NEWLGAS.clear();
        if (on) rmLgas().forEach((l) => NEWLGAS.add(l));
        render();
      }
      function roomLgaPicker() {
        setTimeout(rlgLoad, 0);
        const st = rmState(),
          L = rmLgas(),
          one = NEWK == "lga";
        if (RKINDS[NEWK][3]) return st ? `<div class="muted" style="margin:2px 0 8px"><i class="fas fa-circle-check"></i> ${RKINDS[NEWK][0]} covers <b>all of ${esc(st)}</b> — there are no LGAs to choose.</div>` : '<div class="muted" style="margin:2px 0 8px">Choose the state.</div>';
        if (!st) return '<div class="muted" style="margin:2px 0 8px">Choose the state first, then pick the LGA' + (one ? "" : "s") + ".</div>";
        if (!L.length)
          return `<div class="muted" style="margin:2px 0 4px">${esc(st)}'s LGA list is not loaded${ME.su ? " (see the Locations tab)" : ""}, so type the LGA${one ? "" : "s, separated by commas"}.</div><input class="fi" id="rl" value="${esc(NEWTXT)}" oninput="NEWTXT=this.value" placeholder="${one ? "LGA name" : "e.g. Dala, Fagge, Gwale"}">`;
        return `<div class="muted" style="margin:2px 0 4px">${one ? "LGA this room covers (choose one)" : "LGAs this zone covers — tick each one"} <b id="lgan">${one ? "" : "· " + NEWLGAS.size + " ticked"}</b>${one ? "" : ' <a href="#" onclick="lgaAll(true);return false">select all</a> · <a href="#" onclick="lgaAll(false);return false">clear</a>'}</div><div class="lgabox">${L.map((l) => `<label><input type="${one ? "radio" : "checkbox"}" name="rlga" value="${esc(l)}" ${NEWLGAS.has(l) ? "checked" : ""} onchange="lgaPick(this)"> ${esc(l)}${DATA.rooms.some((r) => r.state == st && (r.scope || "").toLowerCase().split(",").includes(l.toLowerCase())) ? ' <span class="muted">· has a room</span>' : ""}</label>`).join("")}</div>`;
      }
      async function newRoom() {
        try {
          const st = rmState(),
            one = NEWK == "lga",
            whole = RKINDS[NEWK][3],
            list = whole ? [] : rmLgas().length ? [...NEWLGAS] : NEWTXT.split(",").map((x) => x.trim()).filter(Boolean);
          if (!st) return toast("⚠️ Choose the state.");
          if (!whole && !list.length) return toast(one ? "⚠️ Choose the LGA this room covers." : "⚠️ Choose the LGAs this zone covers.");
          if (one && list.length != 1) return toast("⚠️ An LGA chairman's room covers exactly one LGA.");
          const r = await A.post("rooms", {
            name: NEWNM.trim() || (one ? list[0] + " LGA Situation Room" : whole ? KNAME[NEWK] + " — " + st : KNAME[NEWK] + ": " + list.join(", ")),
            state: st,
            kind: NEWK,
            scope: list.join(","),
            operator: NEWOP.trim(),
            officer: $("#ro_n")?.value.trim() ? { name: $("#ro_n").value.trim(), phone: $("#ro_p").value } : undefined,
          });
          if (r.officer) afterModal(() => offCred(r.officer));
          NEWPASS = { id: r.id, p: r.passcode, inactive: true };
          NEWLGAS.clear();
          NEWNM = NEWOP = NEWTXT = "";
          loadAll();
        } catch (e) {
          toast("⚠️ " + e.message);
        }
      }
      // the state chosen above is used here too (or fixed by the Command Center): no second choice
      const bulkState = () => (rmState() ? `<div class="fi" style="background:#f7fafc;color:#4a5568"><i class="fas fa-lock" style="font-size:11px"></i> State: <b>${esc(rmState())}</b> <span class="muted">(${ME.tenantState ? "fixed for this Command Center" : "as chosen above"})</span></div>` : `<select class="fi" id="bs" onchange="NEWST=this.value;RLG.st=null;render()"><option value="">Choose the state…</option>${CFG.states.map((s) => `<option>${s}</option>`).join("")}</select>`);
      // the LGAs that still need their Collation Officer: one line each — "LGA, name, phone"
      function bulkOfficers(lgas) {
        const w = document.createElement("div");
        w.style.cssText = "position:fixed;inset:0;background:rgba(15,23,42,.6);z-index:9000;display:flex;align-items:center;justify-content:center;padding:14px;overflow:auto";
        w.innerHTML = `<div class="card" style="max-width:520px;width:100%;margin:auto"><div class="card-header"><h3><i class="fas fa-clipboard-check"></i> LGA Collation Officers needed</h3></div><div class="muted" style="margin-bottom:8px">A room is only created together with its LGA officer. Type the name (and phone) after each LGA, one per line — leave an LGA as it is to skip it for now.</div><textarea id="bo_t" class="fi" rows="12" style="font-family:monospace">${lgas.map((l) => esc(l) + ", ").join("\n")}</textarea><div style="display:flex;gap:8px;margin-top:10px"><button class="btn btn-primary" id="bo_go">Create rooms &amp; officers</button><button class="btn btn-outline" id="bo_x">Cancel</button></div></div>`;
        document.body.appendChild(w);
        w.querySelector("#bo_x").onclick = () => w.remove();
        w.querySelector("#bo_go").onclick = async () => {
          const officers = w.querySelector("#bo_t").value.split("\n").map((l) => l.split(",").map((x) => x.trim())).filter((p) => p[0] && p[1]).map((p) => ({ lga: p[0], name: p[1], phone: p[2] || "" }));
          if (!officers.length) return toast("⚠️ Add at least one officer name.");
          try {
            const r = await A.post("rooms/bulk", { state: rmState(), activate: $("#ba")?.checked, officers });
            w.remove();
            toast("✅ " + r.created.length + " rooms and " + (r.officers || []).length + " officers created" + (r.needOfficer.length ? " · " + r.needOfficer.length + " LGAs still need an officer" : ""));
            if ((r.officers || []).length) printCreds("Collation officer sign-in sheets", r.officers.map((o) => ({ title: o.title + " — " + o.name, lines: [["Sign in at", ORIGIN.replace(/^https?:\/\//, "") + "/officer/"], ["Officer code", o.code], ["Passcode", o.passcode], ["Area", o.lga]], link: loginLink("officer", o.code, o.passcode) })));
            if (r.created.length) printCreds("Situation Room sign-in sheets", r.created.map((x) => roomCredOf({ id: x.id, name: x.name, passcode: x.passcode })));
            loadAll();
          } catch (e) { toast("⚠️ " + e.message); }
        };
      }
      async function bulkRooms() {
        const st = rmState();
        if (!st) return toast("⚠️ Choose the state first.");
        if (!confirm("Create one Situation Room for every LGA in " + st + "?")) return;
        try {
          const r = await A.post("rooms/bulk", { state: st, activate: $("#ba").checked });
          if (r.needOfficer?.length) bulkOfficers(r.needOfficer);
          if (false) toast("⚠️ " + r.needOfficer.length + " LGA" + (r.needOfficer.length == 1 ? "" : "s") + " have no LGA Collation Officer yet, so no room was made for " + (r.needOfficer.length == 1 ? "it" : "them") + ". Add the officers in the Collation Officers tab, then run this again.");
          if (r.created.length) {
            const csv = "room_id,name,lga,passcode\n" + r.created.map((x) => [x.id, x.name, x.lga, x.passcode].join(",")).join("\n");
            const a = document.createElement("a");
            a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv" }));
            a.download = st + "_room_passcodes.csv";
            a.click();
          }
          if (r.created.length) printCreds(st + " Situation Room sign-in sheets", r.created.map(roomCredOf));
          toast("✅ " + r.created.length + " rooms created" + (r.skipped ? ", " + r.skipped + " already existed" : "") + ". Passcodes downloaded.");
          loadAll();
        } catch (e) {
          toast("⚠️ " + e.message);
        }
      }
      // one room's sign-in card: Room ID + passcode + QR
      const roomCredOf = (x) => ({ title: (x.name || (DATA.rooms.find((r) => r.id == x.id) || {}).name || "Situation Room") + " — sign-in", lines: [["Sign in at", ORIGIN.replace(/^https?:\/\//, "") + "/room/"], ["Room ID", x.id], ["Passcode", x.passcode || x.p]], link: loginLink("room", x.id, x.passcode || x.p) });
      const roomCred = (x) => credModal({ ...roomCredOf(x), note: "The passcode is stored hashed and cannot be shown again — only reset." });
      async function renameRoom(id, cur) {
        const n = prompt("New Situation Room name (shown on its banner and on the observer app):", cur);
        if (n && n.trim()) A.f("rooms/" + id, { method: "PATCH", body: { name: n.trim() } }).then(() => { toast("✅ Renamed."); loadAll(); }).catch((e) => toast("⚠️ " + e.message));
      }
      async function resetP(id) {
        if (!confirm("Generate a new passcode for " + id + "? The old one stops working.")) return;
        const r = await A.post("rooms/" + id + "/reset");
        NEWPASS = { id, p: r.passcode };
        render();
      }
      function cObs() {
        const l = flt(DATA.obs);
        MS = { l, inc: DATA.inc.filter((i) => !F.room || i.room_id == F.room), rooms: 1 };
        return `<div class="dashboard-grid"><div class="col">${cardSearch(1, DATA.obs)}${cardMap(l, "<span>🟦 Room</span>")}</div><div class="col">${cardFeed(0)}<div class="card"><div class="card-header"><h3><i class="fas fa-users"></i> Observers (${l.length})</h3>${l.length > 300 ? '<span class="tag">first 300 shown - narrow with the search</span>' : ""}</div><div class="tw" style="max-height:340px;overflow-y:auto"><table><tr><th>Code</th><th>Room</th><th>Location</th><th>Status</th><th>Tallies (hover = edit history)</th><th></th></tr>${l.slice(0, 300).map((o) => `<tr><td class="mono">${esc(o.code)}</td><td>${esc(o.room_id)}</td><td>${esc(o.lga)}/PU ${esc(o.pu)}</td><td>${o.active ? pill(st(o)) : '<span class="pill r">Revoked</span>'}</td><td>${tallyCell(o)}</td><td><button class="btn btn-sm btn-outline" onclick="SEL='${o.code}';fit=1;${o.lat != null ? `pinpoint(${o.lat},${o.lng});` : ""}render()">View</button> <button class="btn btn-sm btn-primary" onclick="msgTo('obs:${o.code}',prompt('Talkback message to ${o.code}:'))">Talk</button> <button class="btn btn-sm btn-danger" onclick="liveReq('${o.code}',${!o.live_req})">${o.live_req ? "End live" : "Live"}</button> <button class="btn btn-sm btn-outline" onclick="obsQR('${o.code}')"><i class="fas fa-qrcode"></i> QR</button> <button class="btn btn-sm btn-outline" onclick="offFor('ward','${esc(o.lga)}','${esc(o.ward)}')"><i class="fas fa-clipboard-check"></i> Officer</button> ${o.bound ? `<button class="btn btn-sm btn-outline" onclick="resetDev('${o.code}')">Reset phone</button> ` : ""}<button class="btn btn-sm btn-outline" onclick="A.post('obs/${o.code}/toggle')">${o.active ? "Revoke" : "Activate"}</button></td></tr>`).join("")}</table></div></div></div></div>`;
      }
      const cBc =
        () => `<div class="dashboard-grid"><div class="card"><div class="card-header"><h3><i class="fas fa-bullhorn"></i> Broadcast Console</h3></div><textarea class="fi" id="bm" rows="4" placeholder="Message…" oninput="BCS.msg=this.value">${esc(BCS.msg)}</textarea><select class="fi" id="bt" onchange="bcT(this.value)">${[["ALL_ROOMS", "All Situation Rooms"], ["SUB", "Selected rooms"], ["AREA", "By state / LGA / ward…"], ["ALL_OBS", "ALL observers (emergency alert)"]].map(([v, l]) => `<option value="${v}" ${BCS.t == v ? "selected" : ""}>${l}</option>`).join("")}</select>${BCS.t == "AREA" ? bcArea() : ""}${BCS.t == "SUB" ? `<div style="display:flex;flex-wrap:wrap;gap:10px;margin-bottom:10px">${DATA.rooms.map((r) => `<label class="tag"><input type="checkbox" class="bk" value="${r.id}" ${BCS.ids.has(r.id) ? "checked" : ""} onchange="this.checked?BCS.ids.add(this.value):BCS.ids.delete(this.value)"> ${esc(r.name)}</label>`).join("")}</div>` : ""}<button class="btn btn-danger" onclick="doBc()"><i class="fas fa-bullhorn"></i> Send Broadcast</button></div>
<div class="col"><div class="card"><div class="card-header"><h3><i class="fas fa-check-double"></i> Receipt Tracking</h3></div><div class="contact-list">${DATA.bc.map((m) => `<div class="contact-item"><div class="info"><div class="role">${esc(m.text)}</div><div class="loc">${esc(m.to_scope.startsWith("area:") ? "Observers · " + m.to_scope.slice(5).split("|").filter(Boolean).join(" › ") : m.to_scope.length > 70 ? m.to_scope.slice(0, 70) + "…" : m.to_scope)} · ${DT(m.ts)}</div></div><span class="tag">${m.ack.length}/${m.targets} ack</span></div>`).join("") || '<div class="muted">Nothing sent.</div>'}</div></div>
<div class="card"><div class="card-header"><h3><i class="fas fa-inbox"></i> Inbox</h3></div><div class="contact-list">${
          DATA.msg
            .filter((m) => m.to_scope == "CMD")
            .map(
              (m) =>
                `<div class="contact-item"><div class="info"><div class="role">${esc(m.from_id)}</div><div>${esc(m.text)}</div><div class="loc">${TM(m.ts)}</div></div><button class="btn btn-sm btn-outline" onclick="msgTo('room:${esc(m.from_id)}',prompt('Reply:'))">Reply</button></div>`,
            )
            .join("") || '<div class="muted">No messages.</div>'
        }</div></div></div></div>`;
      // broadcast target: all rooms, chosen rooms, an AREA (state > LGA > ward) or every observer
      const BCS = { t: "ALL_ROOMS", aud: "rooms", state: "", lga: "", ward: "", lgas: [], wards: [], msg: "", ids: new Set(), ls: null, ws: null };
      const bcSt = () => ME.tenantState || BCS.state;
      function bcT(v) {
        BCS.t = v;
        render();

      async function offFor(level, lga, ward, state) {
        try {
          const list = await A.get("officers"),
            eq = (a, b) => String(a || "").toLowerCase() == String(b || "").toLowerCase(),
            o = list.find((x) => x.level == level && (level == "state" ? eq(x.state, state) : eq(x.lga, lga) && (level != "ward" || eq(x.ward, ward)))) || (level == "state" ? list.find((x) => x.level == "federal") : null);
          if (!o) return toast("ℹ️ No " + level + " Collation Officer has been assigned here yet.");
          offView(o.id);
        } catch (e) { toast("⚠️ " + e.message); }
      }
      function rmOfficer(id) {
        const r = DATA.rooms.find((x) => x.id == id) || {}, l = String(r.scope || "").split(",").map((x) => x.trim()).filter(Boolean);
        l.length == 1 ? offFor("lga", l[0], "", r.state) : offFor("state", "", "", r.state);
      }
      async function tnOfficer(id) {
        try {
          const r = await A.get("tenants/" + id + "/officer");
          if (!r.passcode) return noPass();
          offCred(r);
        } catch (e) { toast(e.message == "No officer" ? "ℹ️ This Command Center has no state / federal officer yet." : "⚠️ " + e.message); }
      }
      start("cmd", () => ({
        ...(ME.su ? { tn: ["Command Centers", "sitemap", cTn] } : {}),
        rooms: ["Situation Rooms", "building-columns", cRooms],
        obs: ["Observers & Map", "location-dot", cObs],
        col: ["Global Collation", "chart-column", cCol],
        res: ["Results Review", "scale-balanced", () => cardSearch(1, DATA.obs) + '<div style="margin-top:20px">' + tabResults(true) + "</div>"],
        bc: ["Broadcast", "bullhorn", cBc],
        dat: ["Export & Archive", "download", tabData],
        con: ["Contacts", "address-book", tabContacts],
        radio: ["Radio", "tower-broadcast", cRadio],
        share: ["Share Live View", "share-nodes", tabShare],
        ...(ME.su ? { loc: ["Locations", "map", cLoc], arch: ["Archive", "box-archive", cArchive], mkt: ["Marketing", "chart-line", cMkt] } : {}),
        aud: ["Audit Log", "clipboard-list", tabAudit],
        set: ["App Settings", "gear", cSet],
        help: ["Help", "circle-question", tabHelp],
      }));
    </script>
  </body>
</html>
