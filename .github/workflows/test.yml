name: test
on: [push, pull_request]
jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.15-alpine
        env: { POSTGRES_PASSWORD: postgres }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: sudo apt-get install -y postgresql-client-16 || sudo apt-get install -y postgresql-client
      - run: npm test
        env: { TEST_DATABASE_URL: "postgres://postgres:postgres@localhost:5432/collation_test" }
